<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEAD-ON · PR #612 실제 전투 FX 검증</title>
<script>sessionStorage.setItem('headon-airbattle4-20261025','1');</script>
<style>
 body{margin:0;background:#141a1b;color:#f3eee0;font:14px system-ui,sans-serif}
 header{padding:14px 18px;background:#202b2c;border-bottom:1px solid #56615b}
 h1{font-size:18px;margin:0 0 7px}p{margin:0;color:#d4ceba}
 nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 15px}
 button{background:#2c3b3b;border:1px solid #bca676;border-radius:4px;color:#fff3ce;padding:11px 15px;cursor:pointer;font-weight:700}
 button:hover{background:#495a52}
 #status{padding:0 16px 10px;color:#d6c08a}
 iframe{display:block;width:100%;height:760px;border:0;background:#121815}
</style>
</head>
<body>
<header><h1>HEAD-ON · PR #612 실제 전투 FX 검증</h1><p>공개 프리뷰 게임 엔진 그대로 실행. 아래 버튼은 테스트 장비를 지급하고 실제 전투 함수를 발동합니다. 별도 합성 이미지가 아닙니다.</p></header>
<nav>
 <button type="button" data-kind="fokkerLeimberger">라임베르거 · 회전 발사/탄피</button>
 <button type="button" data-kind="vickersPomPom">폼폼포 · 대공 공중폭발</button>
 <button type="button" data-kind="sn1650">S.N. 1,650파운드 · 낙하/폭발</button>
</nav>
<div id="status">게임 엔진 로딩 중…</div>
<iframe id="game" title="PR #612 HEAD-ON actual game" src="./index.html?headonTest=1&amp;invincible=1&amp;pilot=baron&amp;region=0&amp;pr612=e360bf1c"></iframe>
<script type="module">
import {applySecretPomFit} from './secret-weapons.js';
import {secretRotaryRound,secretCannonShot,secretCannonImpact,secretVerySignal} from './secret-weapon-combat.js';
import {prepareSynthesisBomb} from './weapon-synthesis.js';
const frame=document.getElementById('game'),status=document.getElementById('status');
let interval=null,epoch=0;
function api(){return frame.contentWindow?.__HEADON_TEST__}
function run(){return api()?.debug()}
function clearDemo(){if(interval)clearInterval(interval);interval=null;epoch++;}
function placeEnemies(g){
 for(let i=0;i<3;i++){
  const count=g.enemies.length;g.spawnEnemy('hunter');
  const e=g.enemies[count]||g.enemies.at(-1);if(!e)continue;
  const d=220+65*(i%2),side=(i-1)*94,a=g.a;
  e.x=g.x+Math.cos(a)*d-Math.sin(a)*side;
  e.y=g.y+Math.sin(a)*d+Math.cos(a)*side;
  e.hp=Math.max(120,e.hp||0);e.maxHp=Math.max(e.maxHp||0,e.hp);
 }
}
function reset(){
 clearDemo();const q=api();if(!q)return null;
 q.start({pilot:'baron',region:0,invincible:true});
 const g=run();if(!g)return null;
 g.state='playing';g.invuln=Infinity;g.nextBossAt=Infinity;g.fire=0;g.a=-Math.PI/2;
 g.enemies.length=0;placeEnemies(g);return g;
}
function equip(g,id,body){
 g.upgrades??={};g.upgrades[body]=1;
 g.secretWeaponState??={slots:{},effects:{}};
 g.secretWeaponState.slots??={};g.secretWeaponState.effects??={};
 g.secretWeaponState.slots[body]=id;
}
function rotary(g){
 g.state='upgrade';g.upgrade('quadLewis','legendary');g.state='playing';
 g.upgrades.maximBelt=1;equip(g,'fokkerLeimberger','quadLewis');
 g.fire=0;let n=0;
 interval=setInterval(()=>{
  if(run()!==g){clearDemo();return}
  const a=g.a+(n%12-5.5)*.004;
  const round={gun:0,x:g.x+Math.cos(a)*25,y:g.y+Math.sin(a)*25,vx:Math.cos(a)*510,vy:Math.sin(a)*510,life:1.3,damage:g.damage||6};
  g.bullets.push(secretRotaryRound(g,round));n++;
 },80);
}
function pom(g){
 g.state='upgrade';g.upgrade('cow37','legendary');g.state='playing';
 equip(g,'vickersPomPom','cow37');g.upgrades.buckinghamBelt=1;
 if(g.cow37)applySecretPomFit(g);
 g.fire=0;
 interval=setInterval(()=>{
  if(run()!==g){clearDemo();return}
  const a=g.a,x=g.x+Math.cos(a)*230,y=g.y+Math.sin(a)*230;
  secretCannonShot(g,a);
  const shell={x,y,vx:Math.cos(a)*390,vy:Math.sin(a)*390,life:1,damage:85,secretWeapon:'vickersPomPom'};
  secretCannonImpact(g,shell,null);
 },700);
}
function heavy(g){
 equip(g,'sn1650','veryPistol');g.upgrades.prototypeAmmo=1;
 const summon=()=>{
  if(run()!==g){clearDemo();return}
  const a=g.a,point={x:g.x+Math.cos(a)*245,y:g.y+Math.sin(a)*245};
  for(let i=0;i<3;i++)secretVerySignal(g,point,prepareSynthesisBomb);
 };
 summon();interval=setInterval(summon,7000);
}
async function activate(kind){
 try{const g=reset();if(!g){status.textContent='게임 로딩 중. 잠시 후 다시 눌러주세요.';return}
 if(kind==='fokkerLeimberger')rotary(g);
 if(kind==='vickersPomPom')pom(g);
 if(kind==='sn1650')heavy(g);
 status.textContent='실제 게임 엔진: '+({fokkerLeimberger:'라임베르거 연속 발사',vickersPomPom:'폼폼포 대공 폭발',sn1650:'S.N. 1,650파운드 낙하'}[kind]||kind)+' · PR #612';
 }catch(e){status.textContent='테스트 오류: '+e.message;console.error(e)}
}
document.querySelectorAll('button[data-kind]').forEach(b=>b.addEventListener('click',()=>activate(b.dataset.kind)));
frame.addEventListener('load',()=>{status.textContent='엔진 로딩 중 · 출격 상태 확인 후 장비 선택';});
setInterval(()=>{if(run()?.state==='playing'&&status.textContent.startsWith('엔진 로딩'))status.textContent='실제 게임 준비 완료 · 장비 버튼 선택';},1000);
</script>
</body></html>
