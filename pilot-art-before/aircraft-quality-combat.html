<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEAD-ON aircraft combat QA</title>
<style>body{background:#17201c;color:#ecdcb9;font:14px system-ui;margin:8px}button,select{padding:7px;margin:3px;background:#353c2e;color:inherit}iframe{display:block;border:1px solid #b69a63;margin:auto;width:1280px;height:800px;max-width:100%}pre{white-space:pre-wrap;max-height:110px;overflow:auto}header{position:sticky;top:0;background:#17201cf0;z-index:3}</style>
<header><b>HEAD-ON · 실제 게임 렌더/전투 표본</b><select id="fixture" aria-label="검사 장면"><option value="elites">정예 4종</option><option value="bombers">적 대형 폭격기 10종</option><option value="support">지원 폭격기 10종</option><option value="escort">괴링 호위</option><option value="l70">L70 보스</option><option value="hma">HMA23 보스</option></select><select id="region" aria-label="맵"><option value="0">밝은 전원</option><option value="15">어두운 파리</option></select><select id="viewport" aria-label="화면 크기"><option value="pc">PC 1280×800</option><option value="mobile">모바일 390×844</option></select><button id="start">검사 장면 시작</button><button id="next">폭격기 다음 2종</button><button id="play">재생</button><button id="pause">관찰 정지</button><button id="paths">폭격기 10개 이미지 로드 검사</button><button id="airship">비행선 화면 배치·상태</button><button id="reveal">L70 캡슐 파괴 후 노출</button><button id="measure">10초 프레임 측정</button><pre id="status">게임 로딩 중</pre></header>
<iframe id="game" title="HEAD-ON actual game" src="./index.html?headonTest=1&autostart=0&v=aircraft-quality-20261017"></iframe>
<script type="module">
const $=s=>document.querySelector(s),frame=$('#game'),keys=['staaken','gotha','aeg_g4','friedrichshafen_g3','handley-page','voisin8','caudron_g4','fe2b','breguet14','felixstowe_f2'];let api,page=0;
const awaitApi=async()=>{for(let i=0;i<900;i++){const a=frame.contentWindow?.__HEADON_TEST__;if(a)return a;await new Promise(r=>setTimeout(r,50));}throw Error('게임 API 로딩 실패')};
function viewport(){const mobile=$('#viewport').value==='mobile';frame.style.width=mobile?'390px':'1280px';frame.style.height=mobile?'844px':'800px';}
async function start(){try{viewport();api=await awaitApi();const kind=$('#fixture').value,boss=kind==='l70'||kind==='hma',pilot=kind==='escort'||kind==='l70'?'fonck':'baron';const result=api.start({region:boss?5:Number($('#region').value),pilot,invincible:true,boss,ace:kind==='escort'?'goering':''});if(!result)throw Error('시작 실패');const g=api.debug();g.fire=Infinity;g.need=Infinity;g.spawn=Infinity;g.nextHeavyAt=Infinity;g.eventTimer=Infinity;g.nextBossAt=Infinity;
 if(boss){$('#status').textContent=kind+' · 실제 보스 진입 중';return;}
 if(kind!=='escort')g.enemies.length=0;g.bullets.length=0;g.friendlyBombers=[];
 if(kind==='elites'){api.step(.02);const kinds=['le_prieur_squadron','schlachtstaffel','junkers_squadron','salamander_squadron'];for(let i=0;i<4;i++){g.eliteEnemies.squadrons=[];const squad=g.eliteEnemies.spawnEncounter(kinds[i]);if(!squad)throw Error('정예 생성 실패');const m=squad.members[0];Object.assign(m,{x:g.x+(i%2?95:-95),y:g.y-145+Math.floor(i/2)*210,a:-Math.PI/2});squad.members=[m];(g.__qaElites??=[]).push(squad);}g.eliteEnemies.squadrons=g.__qaElites;}
 if(kind==='bombers'||kind==='support'){const slice=keys.slice(page*2,page*2+2);let template;if(kind==='bombers'){g.spawnEnemy('heavyBomber');template=g.enemies.at(-1);if(!template)throw Error('폭격기 생성 실패');g.enemies.length=0;}for(let i=0;i<slice.length;i++){if(kind==='bombers'){const e={...template};g.enemies.push(e);Object.assign(e,{airframe:slice[i],name:slice[i],x:g.x+(i?90:-90),y:g.y-90,a:-Math.PI/2,fire:Infinity,speed:0});}else g.friendlyBombers.push({airframe:slice[i],ox:g.x,oy:g.y,x:g.x+(i?90:-90),y:g.y-90,a:-Math.PI/2,age:0,drop:Infinity,left:0});}$('#status').textContent='실제 게임 '+kind+' · '+slice.join(' / ');}
 else if(kind==='escort'){api.step(.2);const escorts=g.enemies.filter(e=>e.escortPlane==='white-fokkerdv55');escorts.forEach((e,i)=>Object.assign(e,{x:g.x+(i%2?90:-90),y:g.y-80-Math.floor(i/2)*60,a:-Math.PI/2}));g.state='paused';$('#status').textContent='괴링 적 에이스 · 실제 호위기 '+escorts.length+'기 · 검사 위치 배치';return;}else $('#status').textContent='실제 정예 4종 · 위치만 검사 화면에 배치';
 g.state='paused';}catch(e){$('#status').textContent='검사 오류: '+e.message;}}
$('#start').onclick=start;$('#next').onclick=()=>{page=(page+1)%5;start()};$('#viewport').onchange=viewport;$('#play').onclick=()=>{if(api)api.freeze(false)};$('#pause').onclick=()=>{if(api)api.freeze(true)};
$('#paths').onclick=async()=>{const results=[];for(const key of keys){const im=new Image(),ok=await new Promise(resolve=>{im.onload=()=>resolve(true);im.onerror=()=>resolve(false);im.src='./asset-bank/outlined/native/'+key+'.webp?v=gal2&b=bomber17';});results.push({key,ok,width:im.naturalWidth,height:im.naturalHeight});}$('#status').textContent=JSON.stringify({kind:'actual image GET/decode at game path',loaded:results.filter(r=>r.ok).length,total:results.length,results},null,2);};
function airshipStatus(){frame.contentDocument.getElementById('modal')?.classList.add('hidden');const g=api?.debug(),bs=[...g?.stageBoss?.stages.encounter?.bodies.values()||[]];$('#status').textContent=JSON.stringify({kind:'actual game boss renderer; QA camera framing',bodies:bs.map(b=>({kind:b.kind,phase:b.phase,dx:Math.round(b.x-g.x),dy:Math.round(b.y-g.y),parts:[...b.parts.values()].map(p=>({id:p.id,hittable:p.hittable,destroyed:p.destroyed}))}))},null,2);}
$('#airship').onclick=()=>{const g=api?.debug(),b=g?.stageBoss?.stages.encounter?.bodies.values().next().value;if(!b)return;g.x=b.x;g.y=b.y+40;g.state='paused';airshipStatus()};
$('#reveal').onclick=()=>{const g=api?.debug(),sb=g?.stageBoss,b=sb?.stages.encounter?.bodies.values().next().value;if(b?.kind!=='zeppelin-l70')return;const p=b.parts.get('capsule');sb.hit({bodyId:b.id,partId:p.id,damage:p.maxHp*2,faction:g.teamFaction});api.step(2);g.x=b.x;g.y=b.y+40;g.state='paused';airshipStatus()};
$('#measure').onclick=async()=>{if(!api)return;const g=api.debug();if(!g)return;const frames=[],t0=performance.now();let prev=t0;await new Promise(resolve=>{function frame(t){frames.push(t-prev);prev=t;if(t-t0<10000)requestAnimationFrame(frame);else resolve();}requestAnimationFrame(frame)});frames.shift();const sorted=[...frames].sort((a,b)=>a-b),elapsed=frames.reduce((s,t)=>s+t,0);$('#status').textContent=JSON.stringify({kind:'cloud-browser presentation frame timing, not physical mobile FPS or memory',viewport:$('#viewport').value,fixture:$('#fixture').value,frames:frames.length,averageFps:Math.round(frames.length*100000/elapsed)/100,p95FrameMs:sorted[Math.floor(sorted.length*.95)]},null,2);};
viewport();api=await awaitApi();$('#status').textContent='준비 완료 · 게임 코드/전투 규칙 변경 없이 테스트 모드 사용';
</script></html>
