<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEAD-ON 폭격기 화풍 검사</title><style>body{margin:16px;background:#17201b;color:#e8ddc1;font:14px system-ui}button,select{padding:10px;margin:4px;background:#364037;color:inherit;border:1px solid #b49b60}canvas{display:block;background:#778363;max-width:100%;margin:12px 0}pre{white-space:pre-wrap}h1{font-size:19px}a{color:#dec592}</style><h1>HEAD-ON · 폭격기 전체 화풍 검사</h1><button id="base">기종 전체</button><button id="paints">도색 전체</button><button id="individual">일반·기계식</button><button id="field">대형 원본</button><button id="effects">회전·그림자·피격</button><select id="viewport"><option value="1280">PC 1280</option><option value="390">모바일 390</option></select><a href="?mech=0">일반 버전</a> <a href="?mech=1">기계식 버전</a> <a href="./test-lab.html">실전 전환·액티브 검사</a><pre id="status">로딩 중…</pre><canvas id="view" width="1280" height="650"></canvas><script type="module">
import {BANK_ART} from './aircraft-bank-art.js?v=bomber17';
import {planeSprite,paintedReady} from './aircraft.js?v=buildfit1';
const families=['aeg_g4','breguet14','caproni_ca3','caudron_g4','caudron_r11','dh4','dh9','felixstowe_f2','friedrichshafen_g3','gotha_g4','hp_o400','ilya_muromets','staaken_r6','voisin8','fe2b'];
const paints=Object.entries(BANK_ART).filter(([key,a])=>families.includes(a.family)||['bank_sea_gotha_wd14','bank_sea_short_184'].includes(key)).map(([k])=>k);
const bases=families.map(f=>BANK_ART['bank_livery_'+f+'__standard']?'bank_livery_'+f+'__standard':Object.entries(BANK_ART).find(([k,a])=>a.family===f)[0]).concat(['bank_sea_gotha_wd14','bank_sea_short_184']);
const stock=Object.keys(BANK_ART).filter(k=>k.startsWith('bank_plane_')&&['caproni_ca3','caudron_r11','dh4','dh9','hp_o400','ilya_muromets','staaken_r6'].includes(k.slice(11)));
const individuals=['aeg_g4','breguet14','caudron_g4','dh4','fe2b','felixstowe_f2','friedrichshafen_g3','gotha','gotha_night','handley-page','staaken','staaken_dark','voisin8'];
const fieldNames=individuals.filter(x=>!['dh4','gotha_night','staaken_dark'].includes(x));
const $=id=>document.getElementById(id),c=$('view'),ctx=c.getContext('2d');let keys=[],animate=false,angle=-Math.PI/2,field=false,images={};
function paint(){const cols=c.width<500?2:7,cell=c.width/cols,h=155;c.height=Math.ceil(keys.length/cols)*h;ctx.clearRect(0,0,c.width,c.height);keys.forEach((key,i)=>{const x=(i%cols+.5)*cell,y=Math.floor(i/cols)*h+73;if(field){const im=images[key];if(im){const k=Math.min((cell-12)/im.width,125/im.height);ctx.save();ctx.translate(x,y);ctx.rotate(animate?angle+Math.PI/2:0);ctx.drawImage(im,-im.width*k/2,-im.height*k/2,im.width*k,im.height*k);ctx.restore()}}else{if(animate)planeSprite(ctx,x+6,y+8,angle,key,.8,false,true);planeSprite(ctx,x,y,animate?angle:-Math.PI/2,key,.8,false,false,animate?.08:0,animate?2:false)}ctx.font='10px system-ui';ctx.fillStyle='#111b11';ctx.textAlign='center';ctx.fillText(key.replace('bank_livery_','').replace('bank_sea_',''),x,Math.floor(i/cols)*h+148)});}
async function show(list,isField=false){field=isField;keys=list;const failures=[];for(const key of keys){if(field){const im=new Image();im.src='./asset-bank/outlined/native/'+key+'.webp?v=bomber17';try{await im.decode();images[key]=im}catch{failures.push(key)}}else if(!await paintedReady(key))failures.push(key)}$('status').textContent=`검사 ${keys.length}개 · 성공 ${keys.length-failures.length} · 실패 ${failures.length}`+(failures.length?'\n'+failures.join('\n'):'');paint()}
$('base').onclick=()=>show(bases.concat(stock,['bomber-transfer-gotha','bomber-transfer-o400']));$('paints').onclick=()=>show(paints);$('individual').onclick=()=>show(individuals);$('field').onclick=()=>show(fieldNames,true);$('effects').onclick=()=>{animate=!animate;paint()};$('viewport').onchange=()=>{c.width=+$('viewport').value;paint()};function loop(){if(animate){angle+=.015;paint()}requestAnimationFrame(loop)}loop();await show(bases.concat(stock,['bomber-transfer-gotha','bomber-transfer-o400']));
</script></html>
