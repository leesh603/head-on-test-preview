name: Mission rewards task
on:
  push:
    branches: [feat/mission-combat-rewards]
    paths:
      - .github/workflows/mission-rewards-task.yml
      - tools/mission-rewards-apply.py
permissions:
  contents: write
concurrency:
  group: mission-rewards-task
  cancel-in-progress: false
jobs:
  mission-rewards:
    if: github.ref == 'refs/heads/feat/mission-combat-rewards'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.js
            /package.json
            /tests/
            /tools/mission-rewards-apply.py
            /.github/workflows/mission-rewards-task.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact checked patch
        if: hashFiles('tools/mission-rewards-apply.py') != ''
        run: python3 tools/mission-rewards-apply.py
      - name: Syntax, diff and 35 focused mission checks
        if: hashFiles('tools/mission-rewards-apply.py') != ''
        run: |
          git diff --check
          for file in battlefield-events170.js app.js engine.js coop-engine.js stageboss-host.js stageboss-view.js; do node --check "$file" || exit 1; done
          node --test tests/mission-combat-rewards.test.mjs tests/battlefield-recon.test.mjs tests/director-scene-flow.test.mjs
      - name: Commit checked changes to this task branch only
        if: hashFiles('tools/mission-rewards-apply.py') != ''
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/mission-combat-rewards | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '80a1e50a6b5ad14244c6dc63edd3a7e316e07a20'
          git add -- battlefield-events170.js app.js engine.js coop-engine.js stageboss-host.js stageboss-view.js tests/mission-combat-rewards.test.mjs
          git config user.name 'HEAD-ON mission rewards task'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: mission combat rewards with full repair and 35 focused checks'
          git push origin HEAD:refs/heads/feat/mission-combat-rewards
