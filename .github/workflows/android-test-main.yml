name: Android Test-Main APK

on:
  push:
    branches:
      - feat/android-test-main-d7e3bbc5-20261005
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "platform-tools"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare latest test-main package
        run: npm run prepare:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync HEAD-ON assets
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: head-on-test-main-d7e3bbc5-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
