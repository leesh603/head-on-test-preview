<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEAD-ON 윤곽선 비교 검사</title><style>body{margin:20px;background:#171e22;color:#e8ddc1;font:14px system-ui}button,select{padding:10px;margin:6px;background:#364037;color:inherit;border:1px solid #b49b60}canvas{display:block;background:#7c8765;max-width:100%;margin-top:12px}pre{white-space:pre-wrap;line-height:1.6}img{max-width:100%}</style><h1>HEAD-ON · 윤곽선 사전 처리 검사</h1><p>같은 기체 60개를 같은 위치·회전·피격·손상 조건으로 그립니다. 실제 휴대폰 수치와는 구분한 브라우저 측정입니다.</p><label>화면 <select id="viewport"><option value="390">모바일 화면 390×844</option><option value="1280">PC 화면 1280×800</option></select></label><button id="run">전후 측정</button><button id="rotate">회전·피격·손상 보기</button><pre id="status">대기 · baseline c61f074 / baked outline2</pre><canvas id="battle" width="390" height="844"></canvas><script type="module">
const $=id=>document.getElementById(id),c=$('battle'),ctx=c.getContext('2d'),names=['fokker_standard','barker_snipe','camel','nieuport','gotha','handley-page','spad','fokkerd7','bank_plane_caproni_ca3','bank_airship_zeppelin_l30','transfer-r29','transfer-aeg-ji'];
let modules=null,display=null,phase=0,busy=false;
async function load(){if(modules)return modules;const time=performance.now();const before=await import('./outline-qa-legacy-aircraft.js?v=c61f074');await before.aircraftReady;await Promise.all(names.map(k=>before.paintedReady(k)));const legacyMs=performance.now()-time;const start=performance.now();const after=await import('./aircraft.js?v=outline2&art=pilot-recovery2&pf=1027&crewbake=1');await after.aircraftReady;await Promise.all(names.map(k=>after.paintedReady(k)));const bakedMs=performance.now()-start;modules={before,after,legacyMs,bakedMs};return modules;}
function paint(mod,t){ctx.clearRect(0,0,c.width,c.height);for(let i=0;i<60;i++){const key=names[i%names.length],x=38+(i%6)*(c.width-76)/5,y=45+Math.floor(i/6)*(c.height-90)/9,a=t*.7+i*.27;mod.planeSprite(ctx,x+8,y+10,a,key,.72,false,true);mod.planeSprite(ctx,x,y,a,key,.72,false,false,i%7===0?.08:0,i%9===0?2:false);}}
async function paired(before,after){for(let n=0;n<25;n++){paint(before,n/60);paint(after,n/60);}const times={before:[],after:[]},frames=[];let previous=null;await new Promise(resolve=>{let n=0;function tick(now){if(previous!==null)frames.push(now-previous);previous=now;const order=n%2?['after','before']:['before','after'];for(const name of order){const start=performance.now();paint(name==='before'?before:after,n/60);times[name].push(performance.now()-start);}if(++n<60)requestAnimationFrame(tick);else resolve();}requestAnimationFrame(tick);});const stats=a=>{a.sort((x,y)=>x-y);return {mean:a.reduce((x,y)=>x+y,0)/a.length,p95:a[Math.floor(a.length*.95)]};};return {before:stats(times.before),after:stats(times.after),fps:1000/(frames.reduce((x,y)=>x+y,0)/frames.length)};}
$('run').onclick=async()=>{if(busy)return;busy=true;display=null;$('run').disabled=true;c.width=Number($('viewport').value);c.height=c.width===390?844:800;try{$('status').textContent='원본과 사전 처리 기체 로딩 중…';const m=await load();$('status').textContent='같은 프레임에서 전후 순서를 교대하며 60기 측정 중…';const result=await paired(m.before,m.after),{before,after}=result;const fmt=r=>`draw 평균 ${r.mean.toFixed(2)} ms / p95 ${r.p95.toFixed(2)} ms`; $('status').textContent=`완료 · ${c.width}×${c.height} · 60기, 60프레임 교대 비교\n기존: ${fmt(before)}\n사전: ${fmt(after)}\n초기 로딩: 기존 ${(m.legacyMs/1000).toFixed(2)}초 / 사전 ${(m.bakedMs/1000).toFixed(2)}초\n브라우저 rAF: ${result.fps.toFixed(1)} FPS (두 렌더러를 함께 측정한 환경 수치)\n일반 기체 캐시: 전후 288×320 Canvas 동일. 원화 보존.\n주의: 초기가져오기 시간은 이 브라우저의 캐시·네트워크 상태를 포함합니다.`;display=m.after;}catch(e){$('status').textContent='오류: '+e.message;}finally{busy=false;$('run').disabled=false;}};
$('rotate').onclick=async()=>{try{display=(await load()).after;$('status').textContent='회전·그림자·피격 강조·손상 표시 확인 중 · 60기';}catch(e){$('status').textContent=e.message;}};
function loop(){if(display&&!busy)paint(display,phase+=1/60);requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></html>
