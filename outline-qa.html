<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEAD-ON 윤곽선 비교 검사</title><style>body{margin:20px;background:#171e22;color:#e8ddc1;font:14px system-ui}button,select{padding:10px;margin:6px;background:#364037;color:inherit;border:1px solid #b49b60}canvas{display:block;background:#7c8765;max-width:100%;margin-top:12px}pre{white-space:pre-wrap;line-height:1.6}img{max-width:100%}</style><h1>HEAD-ON · 윤곽선 사전 처리 검사</h1><p>같은 기체 60개를 같은 위치·회전·피격·손상 조건으로 그립니다. 실제 휴대폰 수치와는 구분한 브라우저 측정입니다.</p><label>화면 <select id="viewport"><option value="390">모바일 화면 390×844</option><option value="1280">PC 화면 1280×800</option></select></label><button id="run">전후 측정</button><button id="rotate">회전·피격·손상 보기</button><pre id="status">대기 · baseline c61f074 / baked outline1</pre><canvas id="battle" width="390" height="844"></canvas><script type="module">
const $=id=>document.getElementById(id),c=$('battle'),ctx=c.getContext('2d'),names=['fokker_standard','barker_snipe','camel','nieuport','gotha','handley-page','spad','fokkerd7','bank_plane_caproni_ca3','bank_airship_zeppelin_l30','transfer-r29','transfer-aeg-ji'];
let modules=null,display=null,phase=0,busy=false;
async function load(){if(modules)return modules;const time=performance.now();const before=await import('./outline-qa-legacy-aircraft.js?v=c61f074');await before.aircraftReady;await Promise.all(names.map(k=>before.paintedReady(k)));const legacyMs=performance.now()-time;const start=performance.now();const after=await import('./aircraft.js?v=outline1');await after.aircraftReady;await Promise.all(names.map(k=>after.paintedReady(k)));const bakedMs=performance.now()-start;modules={before,after,legacyMs,bakedMs};return modules;}
function paint(mod,t){ctx.clearRect(0,0,c.width,c.height);for(let i=0;i<60;i++){const key=names[i%names.length],x=38+(i%6)*(c.width-76)/5,y=45+Math.floor(i/6)*(c.height-90)/9,a=t*.7+i*.27;mod.planeSprite(ctx,x+8,y+10,a,key,.72,false,true);mod.planeSprite(ctx,x,y,a,key,.72,false,false,i%7===0?.08:0,i%9===0?2:false);}}
async function sample(mod){for(let n=0;n<25;n++)paint(mod,n/60);const cpu=[],frames=[];let previous=null;await new Promise(resolve=>{let n=0;function tick(now){if(previous!==null)frames.push(now-previous);previous=now;const start=performance.now();paint(mod,n/60);cpu.push(performance.now()-start);if(++n<180)requestAnimationFrame(tick);else resolve();}requestAnimationFrame(tick);});cpu.sort((a,b)=>a-b);return {fps:1000/(frames.reduce((a,b)=>a+b,0)/frames.length),mean:cpu.reduce((a,b)=>a+b,0)/cpu.length,p95:cpu[Math.floor(cpu.length*.95)]};}
$('run').onclick=async()=>{if(busy)return;busy=true;display=null;$('run').disabled=true;c.width=Number($('viewport').value);c.height=c.width===390?844:800;try{$('status').textContent='원본과 사전 처리 기체 로딩 중…';const m=await load();$('status').textContent='기존 렌더러 60기 측정 중…';const before=await sample(m.before);$('status').textContent='사전 처리 렌더러 60기 측정 중…';const after=await sample(m.after);const fmt=r=>`FPS ${r.fps.toFixed(1)} / draw 평균 ${r.mean.toFixed(2)} ms / p95 ${r.p95.toFixed(2)} ms`;$('status').textContent=`완료 · ${c.width}×${c.height} · 60기, 180프레임씩\n기존: ${fmt(before)}\n사전: ${fmt(after)}\n초기 로딩: 기존 ${(m.legacyMs/1000).toFixed(2)}초 / 사전 ${(m.bakedMs/1000).toFixed(2)}초\n일반 기체 스프라이트: 전후 288×320 동일. 원화 보존.\n주의: 초기가져오기 시간은 이 브라우저의 캐시·네트워크 상태를 포함합니다.`;display=m.after;}catch(e){$('status').textContent='오류: '+e.message;}finally{busy=false;$('run').disabled=false;}};
$('rotate').onclick=async()=>{try{display=(await load()).after;$('status').textContent='회전·그림자·피격 강조·손상 표시 확인 중 · 60기';}catch(e){$('status').textContent=e.message;}};
function loop(){if(display&&!busy)paint(display,phase+=1/60);requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></html>
