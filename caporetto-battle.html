<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카포레토 실제 전투 개발판</title><style>body{margin:0;background:#162027;color:#eee;font:14px system-ui}header,nav,#status{padding:9px}nav{display:flex;gap:6px;flex-wrap:wrap}button{padding:10px;background:#34494b;color:#fff;border:1px solid #6f8381;border-radius:5px}canvas{display:block;max-width:100%;height:auto;touch-action:none}#status{white-space:pre-wrap}#touch{display:flex;gap:8px}#touch button{min-width:70px;touch-action:none;user-select:none}</style><header><b>카포레토 · 실제 전투 개발판</b><div>본게임 전투 엔진 · 3차 초계 편대 격파 / 120초 제한. 정규 18개 스테이지·저장·온라인은 변경하지 않습니다.</div></header><nav><button id="start">새 출격</button><button id="pause">일시정지</button><button id="pc">PC1280×800</button><button id="mobile">모바일390×844</button><button id="qa">PC·모바일 120초 경계 검수</button></nav><canvas id="map" width="1280" height="800"></canvas><div id="touch"><button id="left">↶ 좌회전</button><button id="right">우회전 ↷</button><button id="fire">발사</button><button id="auto">자동사격 켜기</button><button id="evade">회피</button><button id="reload">재장전</button></div><div id="status">기체와 지형 준비 중…</div><p>PC: A/D 또는 ←/→ 선회, Space 발사, E 회피, R 재장전. 화면을 누르거나 마우스로 방향 지정. 지형 가장자리에서는 자동 회항합니다. 기체와 탄환은 같은 월드 좌표를 사용합니다.</p><script type="module">
import{Game,enemyAircraftScale}from'./engine.js?v=b3bf991d11fc7798';import{planeSprite,paintedReady,aircraftKey}from'./aircraft.js?v=b3bf991d11fc7798';import{enemyAircraftKey}from'./enemy-aircraft-art.js?v=b3bf991d11fc7798';import{CAPORETTO_MAP}from'./caporetto-map-profile.js?v=b3bf991d11fc7798';import{CaporettoTerrain,caporettoWorldToScreen}from'./caporetto-terrain.js?v=b3bf991d11fc7798';import{drawCaporettoDecor}from'./caporetto-placement.js?v=b3bf991d11fc7798';import{createCaporettoBattle}from'./caporetto-battle.js?v=b3bf991d11fc7798';
const cv=document.querySelector('canvas'),ctx=cv.getContext('2d'),out=document.querySelector('#status'),terrain=new CaporettoTerrain(),images={},keys=new Set();let game,paused=true,qa=false,last=0,aim=null,holdFire=false,autoFire=false,turn=0,ready=false;
addEventListener('error',e=>out.textContent='오류: '+e.message);addEventListener('unhandledrejection',e=>out.textContent='오류: '+e.reason);
function start(){game=createCaporettoBattle(Game,{width:cv.width,height:cv.height});paused=false;aim=null;keys.clear();holdFire=false;}
function input(){return{inputMode:'gamepad',moveX:1,angle:aim,steer:turn||(keys.has('ArrowLeft')||keys.has('a')?-1:keys.has('ArrowRight')||keys.has('d')?1:0),fireHeld:autoFire||holdFire||keys.has(' ')};}
function paint(){if(!game)return;const r=terrain.draw(ctx,{x:game.x,y:game.y},cv.width,cv.height);drawCaporettoDecor(ctx,r.camera,CAPORETTO_MAP,images);const pt=(x,y)=>caporettoWorldToScreen(x,y,r.camera);for(const d of game.drops){const p=pt(d.x,d.y);ctx.fillStyle=d.heal?'#b8db91':'#e7cd83';ctx.fillRect(p.x-3,p.y-3,6,6);}for(const e of game.enemies){if(e.hp<=0||e.crashing)continue;const p=pt(e.x,e.y),key=enemyAircraftKey(e,'albatros'),scale=enemyAircraftScale(e);planeSprite(ctx,p.x+14,p.y+22,e.a,key,scale,true,true);planeSprite(ctx,p.x,p.y,e.a,key,scale,true,false,e.hitFlash||0);ctx.fillStyle='#211e1c';ctx.fillRect(p.x-20,p.y-31,40,3);ctx.fillStyle='#d89a79';ctx.fillRect(p.x-20,p.y-31,40*e.hp/e.maxHp,3);if(p.x<16||p.x>cv.width-16||p.y<16||p.y>cv.height-16){const x=Math.max(16,Math.min(cv.width-16,p.x)),y=Math.max(16,Math.min(cv.height-16,p.y));ctx.fillStyle='#e9b17b';ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();}}
for(const b of game.bullets){const p=pt(b.x,b.y);ctx.strokeStyle=b.enemy?'#f3aa7a':'#fff0b0';ctx.lineWidth=b.enemy?2.5:2;const n=Math.hypot(b.vx,b.vy)||1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-b.vx/n*9,p.y-b.vy/n*9);ctx.stroke();}for(const v of game.particles){const p=pt(v.x,v.y);ctx.globalAlpha=Math.min(1,v.life*2);ctx.fillStyle=v.color||'#ddd';ctx.fillRect(p.x-2,p.y-2,4,4);}ctx.globalAlpha=1;const p=pt(game.x,game.y);planeSprite(ctx,p.x+14,p.y+22,game.a,aircraftKey(game.plane,false,game.pilot),.9,false,true);ctx.globalAlpha=game.invuln>0&&Math.floor(game.t*15)%2?.65:1;planeSprite(ctx,p.x,p.y,game.a,aircraftKey(game.plane,false,game.pilot),.9,false,false,game.hitFlash||0);ctx.globalAlpha=1;ctx.fillStyle='#16232bd9';ctx.fillRect(8,8,Math.min(440,cv.width-16),56);ctx.fillStyle='#f2eddd';ctx.font='14px system-ui';ctx.fillText(`HP ${Math.ceil(game.hp)}/${Math.ceil(game.maxHp)} · 편대 ${game.caporetto.wave}/3 · 격추 ${game.kills}`,17,30);ctx.fillText(`${Math.max(0,120-game.t).toFixed(0)}초 · 탄약 ${game.ammo.join('/')} ${game.reloadTime>0?'재장전':''} ${paused?'일시정지':''}`,17,51);out.textContent=`${game.caporetto.status} · 실제 Game.update / ${game.t.toFixed(1)}초 · 적 ${game.enemies.filter(e=>e.hp>0&&!e.crashing).length} · 좌표 ${game.x.toFixed(0)},${game.y.toFixed(0)}\n${game.caporetto.status==='won'?'초계 편대 격파 완료 — 새 출격으로 재시작':game.state==='lost'?'출격 종료 — 새 출격으로 재시작':'정규 스테이지 및 온라인에 등록하지 않은 독립 전투 테스트입니다.'}`;}
function tick(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;if(ready&&!qa&&!paused){game.update(dt,input());paint();}requestAnimationFrame(tick);}
for(const[id,w,h]of[['pc',1280,800],['mobile',390,844]])document.querySelector('#'+id).onclick=()=>{cv.width=w;cv.height=h;if(game){game.viewWidth=w;game.viewHeight=h;}paint();};document.querySelector('#start').onclick=()=>{if(ready&&!qa)start();};document.querySelector('#pause').onclick=()=>{paused=!paused;paint();};document.querySelector('#auto').onclick=()=>{autoFire=!autoFire;document.querySelector('#auto').textContent=autoFire?'자동사격 끄기':'자동사격 켜기';};document.querySelector('#evade').onclick=()=>{if(!paused)game?.evade();};document.querySelector('#reload').onclick=()=>{if(!paused)game?.reload();};
for(const[id,value]of[['left',-1],['right',1]]){const el=document.querySelector('#'+id);el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);turn=value;aim=null;};for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>turn=0);}const fire=document.querySelector('#fire');fire.onpointerdown=e=>{fire.setPointerCapture(e.pointerId);holdFire=true;};for(const ev of ['pointerup','pointercancel','lostpointercapture'])fire.addEventListener(ev,()=>holdFire=false);
cv.onpointerdown=e=>{if(!game||!ready||qa)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*cv.width/r.width,y=(e.clientY-r.top)*cv.height/r.height;const c=terrain.draw(ctx,game,cv.width,cv.height).camera,p=caporettoWorldToScreen(game.x,game.y,c);aim=Math.atan2(y-p.y,x-p.x);};addEventListener('keydown',e=>{if([' ','ArrowLeft','ArrowRight','a','d','e','r'].includes(e.key)){e.preventDefault();keys.add(e.key);if(!paused&&e.key==='e')game?.evade();if(!paused&&e.key==='r')game?.reload();if(['a','d','ArrowLeft','ArrowRight'].includes(e.key))aim=null;}});addEventListener('keyup',e=>keys.delete(e.key));addEventListener('blur',()=>{paused=true;keys.clear();turn=0;holdFire=false;});addEventListener('visibilitychange',()=>{if(document.hidden){paused=true;keys.clear();turn=0;holdFire=false;}});
document.querySelector('#qa').onclick=async()=>{if(!ready||qa)return;qa=true;paused=true;const results=[];for(const w of[390,1280])for(const scenario of ['boundary','dogfight']){cv.width=w;cv.height=w===390?844:800;game=createCaporettoBattle(Game,{width:w,height:cv.height,rng:()=>.5});let failures=0,shots=0;for(let n=0;n<7201;n++){game.invuln=1;const enemy=game.enemies.find(e=>e.hp>0&&!e.crashing);game.update(1/60,{inputMode:'gamepad',moveX:1,angle:scenario==='dogfight'&&enemy?Math.atan2(enemy.y-game.y,enemy.x-game.x):Math.floor(n/900)*Math.PI/2,fireHeld:scenario==='dogfight'});const b=game.caporetto.bounds;if(game.x<b.left||game.x>b.right||game.y<b.top||game.y>b.bottom)failures++;for(const e of game.enemies)if(e.hp>0&&!e.crashing&&(e.x<b.left||e.x>b.right||e.y<b.top||e.y>b.bottom))failures++;shots=Math.max(shots,game.roundsFired);if(n%120===0){paint();out.textContent=`검수 ${w}px ${(n/60).toFixed(0)}/120초`;await new Promise(requestAnimationFrame);}}results.push({width:w,scenario,pass:failures===0&&(scenario==='boundary'?game.caporetto.status==='timeout':game.caporetto.status==='won'&&game.kills===8),failures,shots,kills:game.kills,status:game.caporetto.status,stageBoss:!!game.stageBoss});}qa=false;out.textContent=JSON.stringify({complete:true,results},null,2);};
const loaded=await Promise.all([terrain.prepare(),...['baracca_nieuport','albatros'].map(paintedReady),...['props.webp','hut.webp'].map(src=>new Promise(resolve=>{const im=new Image();im.onload=()=>{images[src]=im;resolve();};im.onerror=resolve;im.src='./asset-bank/maps/caporetto/'+src;}))]);ready=terrain.state==='ready'&&loaded.slice(0,3).every(Boolean);if(ready)start();else out.textContent='필수 지형/기체 이미지 로딩 실패 — 새로고침으로 재시도하세요.';requestAnimationFrame(tick);
</script>
