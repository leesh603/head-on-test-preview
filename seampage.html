<!doctype html><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="favicon.svg?v=imm1"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=imm1"><link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=imm1"><link rel="apple-touch-icon" href="favicon-180.png?v=imm1"><pre id="log"></pre>
<script>
const J={rural:'gen-rural.png',sea:'gen-sea.png',trenches:'gen-trenches.png',burning:'gen-burning.png',city:'gen-city.png',sky:'gen-sky.png',alps:'gen-alps.png'};
const OUT={rural:'terrain-rural.webp',sea:'terrain-sea.webp',trenches:'terrain-trenches.webp',burning:'terrain-burning.webp',city:'terrain-city.webp',sky:'terrain-sky.webp',alps:'terrain-alps-tile.webp'};
const S=768,F=52;
const log=t=>{document.getElementById('log').textContent+=t+'\n'};
const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src});
function edgeStrip(img,axis,fromX,out){
 // 1x768 (or 768x1) strip: average of both opposite edges
 const strip=document.createElement('canvas');
 if(axis==='x'){strip.width=1;strip.height=S}else{strip.width=S;strip.height=1}
 const sg=strip.getContext('2d');
 if(axis==='x'){sg.drawImage(img,0,0,1,S,0,0,1,S);sg.globalAlpha=.5;sg.drawImage(img,S-1,0,1,S,0,0,1,S)}
 else{sg.drawImage(img,0,0,S,1,0,0,S,1);sg.globalAlpha=.5;sg.drawImage(img,0,S-1,S,1,0,0,S,1)}
 return strip;
}
function feather(c){
 const g=c.getContext('2d');
 for(const axis of ['x','y']){
  const m=edgeStrip(c,axis);
  const band=document.createElement('canvas');
  if(axis==='x'){band.width=F;band.height=S}else{band.width=S;band.height=F}
  const bg=band.getContext('2d');
  if(axis==='x')bg.drawImage(m,0,0,1,S,0,0,F,S);else bg.drawImage(m,0,0,S,1,0,0,S,F);
  bg.globalCompositeOperation='destination-in';
  const gr=axis==='x'?bg.createLinearGradient(0,0,F,0):bg.createLinearGradient(0,0,0,F);
  gr.addColorStop(0,'#fff');gr.addColorStop(1,'rgba(0,0,0,0)');
  bg.fillStyle=gr;bg.fillRect(0,0,band.width,band.height);
  if(axis==='x'){g.drawImage(band,0,0);
   const b2=document.createElement('canvas');b2.width=F;b2.height=S;const g2=b2.getContext('2d');
   g2.drawImage(m,0,0,1,S,0,0,F,S);g2.globalCompositeOperation='destination-in';
   const gr2=g2.createLinearGradient(F,0,0,0);gr2.addColorStop(0,'#fff');gr2.addColorStop(1,'rgba(0,0,0,0)');
   g2.fillStyle=gr2;g2.fillRect(0,0,F,S);g.drawImage(b2,S-F,0);}
  else{g.drawImage(band,0,0);
   const b2=document.createElement('canvas');b2.width=S;b2.height=F;const g2=b2.getContext('2d');
   g2.drawImage(m,0,0,S,1,0,0,S,F);g2.globalCompositeOperation='destination-in';
   const gr2=g2.createLinearGradient(0,F,0,0);gr2.addColorStop(0,'#fff');gr2.addColorStop(1,'rgba(0,0,0,0)');
   g2.fillStyle=gr2;g2.fillRect(0,0,S,F);g.drawImage(b2,0,S-F);}
 }
}
(async()=>{
 for(const k of Object.keys(J)){
  const im=await load('./mapgen/'+J[k]);
  const c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
  g.drawImage(im,0,0,S,S);
  feather(c);
  const url=c.toDataURL('image/webp',.9);
  const r=await fetch('/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:OUT[k],data:url})});
  log(k+' -> '+OUT[k]+' '+r.status);
 }
 log('DONE');
})();
</script>
