<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEAD-ON 비밀병기 19종 전투 검사</title>
<style>*{box-sizing:border-box}body{margin:12px;background:#231f19;color:#f4edda;font:14px system-ui}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}button,select{font:inherit;padding:5px}output{display:block;margin:4px 0}iframe{display:block;max-width:100%;margin:auto;border:0}details{margin:5px 0}#tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px}figure{margin:0;background:#2e2b22}figure canvas{display:block;width:100%}figcaption{padding:5px}#results{white-space:pre-wrap}</style>
<header><strong>비밀병기 전투 검사</strong><label>화면 <select id="screen"><option value="390x844">모바일 390×844</option><option value="1280x800">PC 1280×800</option></select></label><label>병기 <select id="case"></select></label><button id="one" disabled>한 종 발동</button><button id="real" disabled>실시간 발동</button><button id="all" disabled>19종 발동</button><button id="rec" disabled>전투 녹화</button><a id="download" hidden>전투 영상 다운로드</a></header><output id="out">로딩 중</output>
<details id="info"><summary>발동 기록과 전투 FX</summary><p id="results"></p><div id="tiles"></div></details>
<iframe id="game" title="비밀병기 실전"></iframe><script>
const $=id=>document.getElementById(id),f=$('game');function resize(){const [w,h]=$('screen').value.split('x');f.width=w;f.height=h;}resize();$('screen').onchange=resize;
let check;window.bindQA=(list,sample)=>{check=sample;for(const [id,label] of list)$('case').add(new Option(label,id));$('out').textContent='준비 완료';for(const id of ['one','real','all','rec'])$(id).disabled=false;};
async function go(ids,realtime=false){for(const id of ['one','real','all','rec'])$(id).disabled=true;$('results').textContent='';$('tiles').replaceChildren();let good=0;for(const id of ids){const name=[...$('case').options].find(o=>o.value===id).textContent;$('out').textContent=name+' 실행 중';try{const r=await check(id,realtime);$('results').textContent+=name+' '+r.k+' · '+r.pixels+'px · '+r.time+'s · 피해 '+r.damage+' · 장면 '+r.age+'s · '+r.cues+'\n';good++;}catch(e){$('results').textContent+=name+' 실패 '+e.message+'\n';}await new Promise(requestAnimationFrame);} $('out').textContent='완료 '+good+'/'+ids.length+' · '+$('screen').value;for(const id of ['one','real','all','rec'])$(id).disabled=false;}
$('one').onclick=()=>go([$('case').value]);$('real').onclick=()=>go([$('case').value],true);$('all').onclick=()=>go([...$('case').options].map(o=>o.value));
$('rec').onclick=async()=>{for(const id of ['one','real','all','rec'])$(id).disabled=true;$('out').textContent='녹화 중';try{$('out').textContent=await f.contentWindow.recordSecretBattle($('case').value);}catch(e){$('out').textContent='녹화 실패 · '+e.message;}finally{for(const id of ['one','real','all','rec'])$(id).disabled=false;}};
const v=new URLSearchParams(location.search).get('v')||'base';
f.src='./index.html?headonTest=1&autostart=0&lab19='+encodeURIComponent(v);
const timer=setInterval(()=>{if(!f.contentWindow?.__HEADON_TEST__)return;clearInterval(timer);const script=f.contentDocument.createElement('script');script.type='module';script.src='./qa-secret-fx-runtime.js?v='+encodeURIComponent(v);script.onerror=()=>$('out').textContent='테스트 모듈 로딩 실패';f.contentDocument.head.append(script);},100);
</script></html>
