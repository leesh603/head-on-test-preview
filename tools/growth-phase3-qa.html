<!doctype html><meta charset="utf-8"><title>HEAD-ON 성장 비교</title><style>body{margin:0;background:#171c18;color:#eee5cf;font:14px system-ui}header{padding:10px;display:flex;gap:7px;flex-wrap:wrap}button,select{background:#303a2c;color:inherit;padding:8px;border:1px solid #8b8b63}iframe{width:390px;height:844px;border:0;flex-shrink:0}main{display:flex;gap:12px}pre{white-space:pre-wrap;max-width:500px}</style>
<header><select id="width"><option value="390">모바일 390×844</option><option value="1280">PC 1280×800</option></select><select id="branch"><option value="base">동일 강화 · 교리 전</option><option value="precision">정밀 집중</option><option value="suppression">연속 제압</option><option value="reinforcement">편대 증원</option><option value="elite">정예 편대</option></select><button id="launch">동일 전투 출격</button><button id="choice">복합 선택 시험</button><button id="grow">속도 계열 추가</button><button id="result">결과창 시험</button><button id="freeze">정지 / 재개</button></header><main><iframe id="game" title="실제 게임" src="../?headonTest=1&autostart=0"></iframe><pre id="status">동일 seed · 동일 강화 · 실제 AI/발사/피해. 무적 관찰자와 진단용30Hz시계, 실제 기기 성능 증거 아님.</pre></main>
<script type="module">
import {tacticalChoices} from '../tactical-doctrines.js';
const $=id=>document.getElementById(id),frame=$('game');let run,api,timer;
$('width').onchange=()=>{frame.style.width=$('width').value+'px';frame.style.height=$('width').value==='390'?'844px':'800px'};
function reset(pattern){api=frame.contentWindow.__HEADON_TEST__;if(!api)throw Error('아직 로딩 중');api.combatBenchmarkStop();api.start({region:0,plane:'fokker',pilot:'baron',seed:1918,invincible:true,...(pattern?{pattern}:{})});run=api.debug();for(const p of run.players||[run])p.need=Infinity;return run;}
$('launch').onclick=()=>{clearInterval(timer);const g=reset('CROSS_ATTACK'),branch=$('branch').value;g.rate=.075;g.damage=24;g.shots=3;g.ammo.fill(10000);g.weapon.belt=10000;if(['precision','suppression'].includes(branch))g.weaponMods={GUN:branch};if(['elite','reinforcement'].includes(branch)){g.permanentWingman=5;g.weaponMods={FORMATION:branch};g.ensureWingmen();}const start=g.t;g.combatBenchmarkRunning=true;g.combatBenchmarkSteps=0;g.combatBenchmarkMeta={scene:'growth',fixture:'fixed seed same upgrade comparisons'};g.combatBenchmarkScript=false;api.startCombatCaptureClock('timer-30hz',null,window);timer=setInterval(()=>{$('status').textContent=JSON.stringify({branch,seconds:+(g.t-start).toFixed(2),kills:g.kills,enemies:g.enemies.filter(e=>e.hp>0).length,projectiles:g.bullets.length,wings:g.allies.length,cues:g.combatFX?.filter(f=>f.fxProfile==='tactical').map(f=>f.tacticalCue),announced:g._netTacticalCombat?.announced,performance:api.trenchPerfRead()},null,2);if(g.t-start>=18||g.state!=='playing'){clearInterval(timer);api.combatBenchmarkStop();api.freeze(true);}},200);};
$('choice').onclick=()=>{clearInterval(timer);const g=reset();g.weaponModSelections={GUN:5,SURVIVAL:3,SPEED:2};g.weaponMods={GUN:'precision'};g.pendingTacticalChoice=tacticalChoices(g);g.state='upgrade';g.event('upgrade','');};
$('grow').onclick=()=>{const g=api.debug();g.weaponModSelections.SPEED=3;g.pendingTacticalChoice=tacticalChoices(g);g.state='upgrade';g.event('upgrade','');};
$('result').onclick=()=>{const g=api?.debug()||reset();api.combatBenchmarkStop();g.state='lost';g.event('end','');};
$('freeze').onclick=()=>{const g=api.debug();api.freeze(g.state!=='paused');};
</script>
