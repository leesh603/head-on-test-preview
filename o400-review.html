<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O/400 보스 검증</title>
<style>body{margin:0;background:#151c20;color:#eee;font:15px system-ui}header{padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{background:#33424b;border:1px solid #7d8c8b;border-radius:4px;padding:9px;color:white}main{display:flex;gap:16px;align-items:start;padding:12px}canvas{background:#64725e;max-width:100%;height:auto;border:1px solid #bbc1ae;touch-action:none}figure{margin:0;max-width:330px}figure img{width:100%;background:#455446}output{display:block;padding:8px;white-space:pre-line}p{padding:0 12px;color:#bfc9c8}body.mobile main{display:block;width:390px;max-width:calc(100% - 24px)}body.mobile figure{max-width:390px;margin-top:14px}</style>
<header><strong>O/400 실제 보스 코드 검증</strong><select id="size" aria-label="화면"><option value="960">PC 960×640</option><option value="390">모바일 390×720</option></select><button id="wing">날개 피격</button><button id="tail">꼬리 피격</button><button id="engine">오른쪽 엔진 피격</button><button id="gap">빈 공간 검사</button><button id="reset">재시작</button></header>
<output id="result">원화 로딩 중…</output><main><canvas id="view" width="960" height="640" aria-label="핸들리페이지 3기 실시간 전투 렌더"></canvas><figure><img src="cutin-o400-squadron.webp" alt="핸들리페이지 편대 전용 컷인"><figcaption>실제 배포용 컷인 · 투명 배경</figcaption></figure></main><output id="state"></output><p>게임의 createBossEncounter · O400Raider.update/hitAt · drawO400를 그대로 실행합니다. 전체 게임 플레이 검증과는 별도입니다.</p>
<script type="module">
import {createBossEncounter} from './headon-stageboss-patterns.js';
import {prepareO400Art,drawO400} from './o400-art.js';
const canvas=document.querySelector('#view'),c=canvas.getContext('2d'),result=document.querySelector('#result'),state=document.querySelector('#state');
let encounter,clock=0,shots=0,last=performance.now();const player={id:'observer',alive:true,x:480,y:320,vx:0,vy:0};
function reset(){shots=0;clock=0;encounter=createBossEncounter({id:'o400-review',bossId:'o400-squadron',x:480,y:320,tuning:{maxHp:3000,partHp:300,damage:10,bulletSpeed:320,patternMultiplier:1},emit:e=>{if(e.kind==='projectile')shots++},rng:()=>.5});result.textContent='준비 완료 · 실제 3기 편대';}
function resize(){const width=Number(document.querySelector('#size').value);canvas.width=width;canvas.height=width===390?720:640;document.body.classList.toggle('mobile',width===390);}
const world=(b,x,y)=>{const a=b.a+Math.PI/2;return{x:b.x+x*Math.cos(a)-y*Math.sin(a),y:b.y+x*Math.sin(a)+y*Math.cos(a)}};
function strike(kind){const b=[...encounter.bodies.values()].find(b=>!b.dead);if(!b)return;const point=kind==='engine'?{x:b.x+b.parts.get('engine-right').x,y:b.y+b.parts.get('engine-right').y}:world(b,...(kind==='gap'?[16,15]:kind==='tail'?[25,41]:[70,-25]));const hit=b.hitAt({...point,radius:0,damage:kind==='engine'?140:25});result.textContent=kind+' → '+JSON.stringify(hit)+' · 본체 HP '+Math.round(b.hp);}
document.querySelector('#size').onchange=resize;document.querySelector('#reset').onclick=reset;for(const name of ['wing','tail','engine','gap'])document.querySelector('#'+name).onclick=()=>strike(name);
await prepareO400Art();reset();resize();
function tick(now){const dt=Math.min(.04,(now-last)/1000);last=now;clock+=dt;const bounds={left:player.x-canvas.width/2,right:player.x+canvas.width/2,top:player.y-canvas.height/2,bottom:player.y+canvas.height/2};encounter.update(dt,{players:[player],bounds});c.clearRect(0,0,canvas.width,canvas.height);c.save();c.translate(canvas.width/2-player.x,canvas.height/2-player.y);for(const b of encounter.bodies.values())if(!b.dead)drawO400(c,{...b,parts:[...b.parts.values()]});c.restore();state.textContent='진행 '+clock.toFixed(1)+'초 · 실제 사격 '+shots+'발\n'+[...encounter.bodies.values()].map(b=>b.id+' · '+b.phase+' · HP '+Math.round(b.hp)+' · 엔진 '+b.engines()).join('\n');requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
