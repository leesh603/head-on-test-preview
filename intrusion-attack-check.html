<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEAD-ON 난입 공격 검증</title>
<style>body{background:#172a31;color:#f0e7d4;font:15px sans-serif;margin:16px}button,select{padding:9px;margin:4px}canvas{background:#294a57;max-width:100%;height:auto}pre{white-space:pre-wrap}table{border-collapse:collapse;font-size:13px}td,th{padding:5px;border:1px solid #60717a}</style>
<h1>난입 보스 공격 검증 · 2026-11-05</h1><button id="all">12종 × PC/모바일 × 직진/선회 검사</button><pre id="result">준비 중</pre>
<select id="boss"></select><select id="size"><option value="390">모바일 390×844</option><option value="1280">PC 1280×800</option></select><select id="motion"><option value="orbit">선회</option><option value="straight">직진</option></select><button id="prepare">실제 엔진 준비</button><button id="step">2초 진행</button><button id="live">실시간 진행</button><pre id="liveResult"></pre><canvas id="canvas"></canvas><div id="table"></div>
<script type="module">
import{forceIntrusionForTest,stepIntrusion,intrusionProfiles}from'./intrusion-bosses.js?v=b3bf991d11fc7798';
import{Game}from'./engine.js?v=b3bf991d11fc7798';import{enableStageBoss}from'./stageboss-host.js?v=b3bf991d11fc7798';
import{prepareIntrusionArt}from'./intrusion-boss-art.js?v=b3bf991d11fc7798';import{drawIntrusionLayer}from'./intrusion-boss-view.js?v=b3bf991d11fc7798';
const $=id=>document.getElementById(id),rows=[];let state,live=false,last=0;
for(const[id,p]of Object.entries(intrusionProfiles))$('boss').add(new Option(p.name,id));$('boss').value='nachtwal';
function make(id,w,h){const g={state:'playing',x:0,y:0,a:-Math.PI/2,hp:10000,speed:185,bullets:[],drops:[],events:[]},c={stageIndex:intrusionProfiles[id].stages[0],width:w,height:h,phase:'explore',remaining:180};return{g,c,e:forceIntrusionForTest(g,id,c),seen:new Set(),count:0,frame:0};}
function observe(s){for(const h of s.e.hazards)if(h.done&&!s.seen.has(h)){s.seen.add(h);s.count++;}for(const b of s.g.bullets)if(b.sourceBossId===s.e.profileId&&!s.seen.has(b)){s.seen.add(b);s.count++;}}
$('all').onclick=()=>{try{rows.length=0;for(const[w,h]of[[390,844],[1280,800]])for(const motion of['straight','orbit'])for(const id of Object.keys(intrusionProfiles)){const s=make(id,w,h);for(let i=0;i<1800;i++){const g=s.g;g.a=-Math.PI/2+(motion==='orbit'?i/60*.65:0);g.vx=Math.cos(g.a)*185;g.vy=Math.sin(g.a)*185;g.x+=g.vx/60;g.y+=g.vy/60;stepIntrusion(g,1/60,s.c);observe(s);}rows.push({id,w,motion,discharges:s.count,pass:s.count>0});}const pass=rows.filter(r=>r.pass).length;$('result').textContent=`${pass}/48 통과 · 실제 발사/착탄 확인`;$('table').innerHTML='<table><tr><th>보스</th><th>화면</th><th>이동</th><th>발사·착탄</th></tr>'+rows.map(r=>`<tr><td>${r.id}</td><td>${r.w}</td><td>${r.motion}</td><td>${r.discharges}</td></tr>`).join('')+'</table>';}catch(e){$('result').textContent='FAIL '+e.stack;}};
$('prepare').onclick=async()=>{try{live=false;const id=$('boss').value,w=+$('size').value,h=w===390?844:800;await prepareIntrusionArt(id);const s=make(id,w,h),g=new Game('camel','fonck',()=>.5);Object.assign(g,{viewWidth:w,viewHeight:h,invuln:1e9,fire:Infinity,spawn:Infinity,need:1e9});enableStageBoss(g,{teamFaction:intrusionProfiles[id].faction==='central'?'entente':'central'});Object.assign(g.stageBoss.stages,{stageIndex:s.c.stageIndex,orderPosition:2,phase:'explore'});s.g=g;s.e=forceIntrusionForTest(g,id,s.c);state=s;$('canvas').width=w;$('canvas').height=h;paint();}catch(e){$('liveResult').textContent=e.stack;}};
function advance(){if(!state)return;const s=state,g=s.g;g.stageStartTime=g.t;g.stageStartDistance=g.distance||0;g.invuln=1e9;g.pendingLevelUps=[];g.enemies=g.enemies.filter(t=>t.intrusionBody);g.battlefieldEvents=null;g.ruralFronts=null;g.photoRecon=null;g.update(1/60,{angle:-Math.PI/2+($('motion').value==='orbit'?s.frame/60*.65:0),inputMode:'gamepad',moveX:1,fireHeld:false});s.frame++;observe(s);}
function paint(){const s=state;if(!s)return;const c=$('canvas').getContext('2d');c.fillStyle='#294a57';c.fillRect(0,0,$('canvas').width,$('canvas').height);drawIntrusionLayer(c,s.g,$('canvas').width,$('canvas').height,'bodies');drawIntrusionLayer(c,s.g,$('canvas').width,$('canvas').height,'effects');$('liveResult').textContent=`${s.e.profileId} · ${s.frame/60|0}초 · ${s.e.phase}/${s.e.naval?.phase||''} · 실제 발사·착탄 ${s.count} · 예고 ${s.e.hazards.length+s.e.shotCues.length}`;}
$('step').onclick=()=>{for(let i=0;i<120;i++)advance();paint();};$('live').onclick=()=>{live=!live;};
function frame(t){if(live&&t-last>=1000/60){advance();paint();last=t;}requestAnimationFrame(frame);}requestAnimationFrame(frame);$('result').textContent='준비 완료';
</script></html>
