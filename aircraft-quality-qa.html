<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HEAD-ON aircraft renderer QA</title>
<style>body{background:#17201c;color:#f2e7cd;font:14px system-ui;margin:16px}button,select{padding:8px;margin:4px;background:#353c2e;color:inherit;border:1px solid #ab9870}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}figure{margin:0;border:1px solid #746b4d}canvas{width:100%;height:auto}figcaption{font:11px monospace;padding:5px;overflow-wrap:anywhere}pre{white-space:pre-wrap}header{position:sticky;top:0;background:#17201cf0;z-index:1;padding:5px}</style>
<header><b>HEAD-ON · 실제 planeSprite 렌더 검사</b><p>이 페이지는 렌더 검사이며 실제 전투·실물 모바일 FPS 검증과 구분합니다.</p><button id="run">746개 전체 검사</button><button id="prev">이전</button><button id="next">다음</button><select id="size" aria-label="표시 크기"><option value="1">PC 표시</option><option value=".75">모바일 축소 표시</option><option value="1.5">확대 표시</option></select><span id="page"></span><pre id="status">준비 중</pre></header><main id="grid"></main><a id="download" hidden>검사 JSON 저장</a>
<script type="module">
import {planeSprite,paintedReady,retainBankArtwork,aircraftReady} from './aircraft.js?v=headon-quality-20261023-7d8a4756';
const rows=await(await fetch('./aircraft-quality-catalogue.json?v=20261017')).json();await aircraftReady;
const q=s=>document.querySelector(s),params=new URLSearchParams(location.search);let page=Number(params.get('page')||0);const count=20;let busy=false;const results=[];
async function show(){const entries=rows.slice(page*count,(page+1)*count);retainBankArtwork(entries.map(r=>r.key));await Promise.all(entries.map(r=>paintedReady(r.key)));q('#grid').replaceChildren();q('#page').textContent=`${page+1}/${Math.ceil(rows.length/count)}`;for(const r of entries){const fig=document.createElement('figure'),c=document.createElement('canvas');c.width=480;c.height=320;const ctx=c.getContext('2d');for(let bg=0;bg<2;bg++){ctx.fillStyle=bg?'#15222d':'#99a278';ctx.fillRect(bg*240,0,240,320);for(const [j,a]of[-Math.PI/2,-Math.PI/4,Math.PI/2].entries())planeSprite(ctx,bg*240+120,55+j*105,a,r.key,Number(q('#size').value));}const label=document.createElement('figcaption');label.textContent=r.key;fig.append(c,label);q('#grid').append(fig);}q('#status').textContent=`표시 ${entries.length}개 · 밝음/어두움 · 3각도`;}
q('#prev').onclick=()=>{page=Math.max(0,page-1);show()};q('#next').onclick=()=>{page=Math.min(Math.ceil(rows.length/count)-1,page+1);show()};q('#size').onchange=show;
q('#run').onclick=async()=>{if(busy)return;busy=true;results.length=0;const c=document.createElement('canvas');c.width=c.height=480;const ctx=c.getContext('2d');for(let i=0;i<rows.length;i++){const r=rows[i];retainBankArtwork([r.key]);const ready=await paintedReady(r.key),checks=[];for(const scale of [.65,1,1.6])for(const angle of [-Math.PI/2,-Math.PI/4,Math.PI/2]){ctx.clearRect(0,0,480,480);planeSprite(ctx,240,240,angle,r.key,scale);const d=ctx.getImageData(0,0,480,480).data;let pixels=0,clipped=false;for(let y=0;y<480;y++)for(let x=0;x<480;x++)if(d[(y*480+x)*4+3]){pixels++;if(x===0||y===0||x===479||y===479)clipped=true;}checks.push({scale,angle,pixels,clipped});}results.push({key:r.key,ready,nonblank:checks.every(c=>c.pixels>0),clipped:checks.some(c=>c.clipped),checks});q('#status').textContent=`검사 ${i+1}/${rows.length}`;if(i%10===0)await new Promise(requestAnimationFrame);}
const summary={baseline:'4a615aaa5209d75741ea2f3d19e7575e0d4a662b',kind:'browser planeSprite; not combat or physical mobile measurement',checked:results.length,passed:results.filter(r=>r.ready&&r.nonblank&&!r.clipped).length,failures:results.filter(r=>!r.ready||!r.nonblank||r.clipped),results};q('#status').textContent=JSON.stringify({checked:summary.checked,passed:summary.passed,failures:summary.failures.map(r=>r.key)},null,2);const link=q('#download');link.hidden=false;link.download='HEADON-browser-aircraft-quality.json';link.href=URL.createObjectURL(new Blob([JSON.stringify(summary,null,2)],{type:'application/json'}));busy=false;};await show();
</script></html>
