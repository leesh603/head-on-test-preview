<!doctype html><meta charset="utf-8"><canvas id="cv" width="390" height="780"></canvas>
<script type="module">
import {Game} from './engine.js?v=220';
import {enableStageBoss} from './stageboss-host.js?v=190';
import {drawStageBoss} from './stageboss-view.js?v=194';
const cv=document.getElementById('cv'),c=cv.getContext('2d');
const g=new Game();g.mode='test';g.plane='fokker';g.x=0;g.y=0;g.z=1;
window.__g=g;
enableStageBoss(g,{teamFaction:'central'});
g.stageBoss.stages.stageIndex=3;
g.stageBoss.startBoss({x:0,y:-330});
let t0=performance.now();
const park=()=>{const b=g.stageBoss.stages.bossBody;if(b){g.x=b.x;g.y=b.y+330}};
function loop(){const now=performance.now(),dt=Math.min(.05,(now-t0)/1000);t0=now;
 g.stageBoss.tick(dt,{players:[{id:'p1',x:g.x,y:g.y,alive:true}],paused:false});
 park();
 c.save();c.fillStyle='#3d4a2e';c.fillRect(0,0,390,780);c.restore();
 drawStageBoss(c,g,cv.width,cv.height,{layer:'all'});
 requestAnimationFrame(loop)}
loop();
window.__info=()=>{const out=[];g.stageBoss.hazards.pool.visit(h=>out.push({k:h.kind,v:h.visual,ph:h.phase,x:Math.round(h.x),y:Math.round(h.y),r:h.radius,len:h.length,ang:h.angle}));return JSON.stringify({hz:out})};
window.__shot=()=>{};
</script>
