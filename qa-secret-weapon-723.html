<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEAD-ON 비밀병기 테스트</title>
<style>body{background:#1b1b18;color:#ede1cb;font:14px system-ui;margin:12px}header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}button,select{font:inherit;padding:6px}iframe{border:0;display:block;max-width:100%;margin:auto}output{display:block;margin:0 0 6px}</style>
<header><label>화면 <select id="size"><option value="390x844">모바일 390×844</option><option value="1280x800">PC 1280×800</option></select></label>
<button data-case="rankenLaunch" disabled>랭킨 다트 발사</button><button data-case="rankenBurst" disabled>랭킨 다트 작렬</button><button data-case="ram" disabled>네스테로프 충각</button></header>
<output id="status">테스트 랩 로딩 중</output>
<iframe id="game" title="비밀병기 전투" src="./index.html?headonTest=1&autostart=0&qa=secret723"></iframe>
<script>
const frame=document.querySelector('#game'),status=document.querySelector('#status'),size=document.querySelector('#size');
const buttons=[...document.querySelectorAll('button[data-case]')];
function resize(){const [w,h]=size.value.split('x');frame.width=w;frame.height=h;}
size.onchange=resize;resize();
function enable(){for(const b of buttons)b.disabled=false;}
const waiting=setInterval(()=>{
 if(frame.contentWindow.__HEADON_TEST__){clearInterval(waiting);enable();status.value='준비 완료';}
},100);
const survival=[['cooldown','normal'],['cooldown','magic'],['cooldown','rare'],['armor','normal'],['regen','normal']];
const gun=[['damage','normal'],['rate','magic'],['spread','rare']];
const speed=[['turn','normal'],['inertiaRetainer','rare'],['maneuverSpring','rare']];
const epic=id=>[id,'legendary'];
for(const button of buttons)button.onclick=()=>{
 for(const b of buttons)b.disabled=true;
 try{
  const expected=button.dataset.case,ram=expected==='ram';
  const api=frame.contentWindow.__HEADON_TEST__;
  if(!api.start({region:'0',pilot:'boelcke',invincible:false}))throw Error('출격 실패');
  const g=api.debug();
  const cards=ram?[epic('steelPlate'),...survival,...speed,epic('buckinghamBelt')]:
   [...survival.slice(0,3),survival[4],...gun,epic('rankinShell'),epic('buckinghamBelt')];
  g.events.length=0;g.spawn=Infinity;g.need=Infinity;g.fire=Infinity;g.level=30;
  for(const [id,rarity] of cards){
   g.state='upgrade';if(!g.upgrade(id,rarity))throw Error('장착 실패 '+id);
   g.pendingTacticalChoice=null;
  }
  const fit=g.secretWeaponState?.slots?.[ram?'steelPlate':'rankinShell'];
  if(fit!==(ram?'nesterovRam':'rankenExplosiveDarts'))throw Error('조합 실패');
  g.state='playing';g.invuln=0;g.enemies.length=0;g.bullets.length=0;g.rankinShrapnelTimer=ram?99:0;
  g.airframeSpeed=1;
  const e=g.spawnEnemy('scout')||g.enemies.at(-1);
  if(!e)throw Error('표적 생성 실패');
  const distance=ram?7:-98;
  Object.assign(e,{x:g.x+Math.cos(g.a)*distance,y:g.y+Math.sin(g.a)*distance,a:g.a,fire:999,hp:1800,maxHp:1800,speed:0,spawnTime:0,invuln:0});
  const start=g.t,hp=g.hp,kinds=new Set();
  const started=performance.now();
  const ageFor=expected==='rankenBurst'?.12:.10;
  status.value='전투 실행 중';
  function observe(){
   const cues=g.secretWeaponFx||[], cue=cues.find(q=>q.kind===expected);
   for(const q of cues)kinds.add(q.kind);
   if(cue&&g.t-cue.at>=.095&&(expected==='rankenLaunch'||e.hp<1800)){
    const cueAge=g.t-cue.at;
    g.state='paused';g.t=cue.at+ageFor;enable();
    const d=frame.contentDocument,badge=d.querySelector('#legendaryInventory canvas[data-secret-status]')?.closest('button');
    const ordinary=d.querySelector('#legendaryInventory button:not(:has(canvas[data-secret-status]))');
    const style=element=>element?frame.contentWindow.getComputedStyle(element).borderRadius:'없음';
    status.value=button.textContent+' · '+g.t.toFixed(2)+'초 · 실제 판정 '+cueAge.toFixed(2)+'초 · '+[...kinds].join(' → ')+' · 적 피해 '+(1800-e.hp).toFixed(1)+' · 내 피해 '+(hp-g.hp).toFixed(1)+' · 테두리 '+style(badge)+' / '+style(ordinary);
   }else if(performance.now()-started>9000){
    g.state='paused';enable();status.value='시험 실패 · '+[...kinds].join(',')+' · '+(g.t-start).toFixed(2)+'초 · 적 체력 '+e.hp;
   }else requestAnimationFrame(observe);
  }
  requestAnimationFrame(observe);
 }catch(e){enable();status.value='시험 오류 · '+e.message;}
};
</script>
