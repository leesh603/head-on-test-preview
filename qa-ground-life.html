<!doctype html><meta charset="utf-8"><title>HEAD-ON Ground Life QA</title><style>body{margin:0;background:#141b1b;color:#d9ccb2;font:13px sans-serif}header{padding:8px;position:fixed;top:0;left:0;right:0;background:#1d2725;z-index:10;white-space:nowrap;overflow-x:auto;font-size:10px}button{font:inherit;margin:2px;padding:4px;cursor:pointer}iframe{border:0;margin-top:80px;width:1280px;height:800px}output{display:block;white-space:normal;font-size:11px;line-height:1.2;max-height:28px;overflow:auto}</style>
<header><b>전장 장식물 브랜치 검증 · 실제 게임 Test Lab bridge</b>
<button data-region="2">참호</button><button data-region="3">포화참호</button><button data-region="8">캉브레</button><button data-region="10">솜</button><button data-region="0">전원</button><button data-region="4">도심</button><button data-region="7">항구</button><button data-region="14">해안</button>
<button id="before">수정 전 main</button><button id="after">수정 후 브랜치</button><button id="mobile">390×844</button><button id="desktop">1280×800</button><button data-time="2">사격</button><button data-time="9.08">포격 순간</button><button data-time="14">잔불·후퇴</button><button id="impact">포격 직전</button><button id="sample">30초 시점</button><button id="step">2초 진행</button><button id="play">실제 플레이</button><button id="perf">성능 180프레임</button><span id="render"></span><span id="assets">지상 atlas 확인 중</span><output id="status">로딩 중</output></header>
<iframe id="game" title="실제 HEAD-ON 브랜치 게임"></iframe><script>
let region=2,time=30,mode='after';const frame=document.querySelector('iframe'),status=document.querySelector('output');
const sites={2:[.291,.165,1254],3:[.286,.213,1254],8:[.86,.283,768],10:[.24,.69,1254],0:[.52,.375,768],4:[.8,.45,768],7:[0,0,1],14:[0,0,1]};
const api=()=>frame.contentWindow.__HEADON_TEST__;
function place(){if(!api()){status.textContent='Test bridge 로딩 중';return}api().start({region,pilot:'baron',invincible:true});const g=api().debug(),s=sites[region];let x=s[0]*s[2]+100,y=s[1]*s[2]+90;
 if(region===7){const r=g.navalRoute,a=r.a,b=a+Math.PI*1.5;x=r.x+Math.cos(a)*12100-Math.sin(a)*150+Math.cos(b)*60-Math.sin(b)*360+100;y=r.y+Math.sin(a)*12100+Math.cos(a)*150+Math.sin(b)*60+Math.cos(b)*360+90;}
 if(region===14){const r=g.gallipoliRoute,a=r.a+Math.PI/2;x=r.x+Math.cos(a)*350-Math.sin(a)*-2920+100;y=r.y+Math.sin(a)*350+Math.cos(a)*-2920+90;}
 Object.assign(g,{x,y,previousX:x,previousY:y,t:time,stageStartTime:time,state:'paused',fire:Infinity,enemies:[],bullets:[]});status.textContent=JSON.stringify({mode,region,time,x:g.x,y:g.y});}
document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{region=+b.dataset.region;place()});
document.querySelector('#impact').onclick=()=>{time=8;place()};document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{time=+b.dataset.time;place()});document.querySelector('#sample').onclick=()=>{time=30;place()};document.querySelector('#step').onclick=()=>{time+=2;place()};
document.querySelector('#mobile').onclick=()=>{frame.style.width='390px';frame.style.height='844px'};
document.querySelector('#desktop').onclick=()=>{frame.style.width='1280px';frame.style.height='800px'};
document.querySelector('#play').onclick=()=>{const g=api()?.debug();if(g){g.state='playing';g.fire=0}};
document.querySelector('#perf').onclick=()=>{const g=api()?.debug();if(!g)return;g.state='playing';frame.contentWindow.__groundTimes=[];const steps=[];let last=0;const tick=now=>{if(last)steps.push(now-last);last=now;if(steps.length<180)return frame.contentWindow.requestAnimationFrame(tick);g.state='paused';steps.sort((a,b)=>a-b);const draws=(frame.contentWindow.__groundTimes||[]).sort((a,b)=>a-b);const pct=(a,p)=>+(a[Math.min(a.length-1,Math.floor(a.length*p))]||0).toFixed(3);status.textContent=JSON.stringify({mode,region,frames:180,layout:[frame.clientWidth,frame.clientHeight],rafMs:{p50:steps[90],p95:steps[171],max:steps[179]},dressingMs:{samples:draws.length,p50:pct(draws,.5),p95:pct(draws,.95),max:pct(draws,1)},note:'Browser layout check, not physical mobile thermal measurement'});};frame.contentWindow.requestAnimationFrame(tick)};
// A preview proxy redirects bitmap requests to a different origin. CORS is
// requested before loading so the engine's normal getImageData remains legal.
// Both versions run their actual module graphs and terrain, not mock renders.
async function loadVersion(which){
 mode=which;status.textContent='실제 게임 로딩 · '+mode;
 const root=which==='before'?new URL('../ffc311c69d2c676636c6defb09c73b1a1534b6d8/',location.href):new URL('../486de944520f3ce65a75e79f3d94e2a40135fda8/',location.href);
 const response=await fetch(new URL('index.html',root)),text=await response.text();
 const appPath=text.match(/\.\/app\.js\?[^'"]+/)[0];let code=await(await fetch(new URL(appPath,root))).text();
 // srcdoc has an empty hostname. Enable only its existing Test Lab bridge.
 code=code.replace("['localhost','127.0.0.1'", "['','localhost','127.0.0.1'");
 code=code.replace(/(from\s*|import\s*\(?)(['"])(\.{1,2}\/[^'"]+)\2/g,(_,prefix,quote,url)=>prefix+quote+new URL(url,root).href+quote);
 code=code.replace(/drawMovingDressing\((ctx,key,[^;]+)\);/,(_,args)=>'{const qaBegin=performance.now();drawMovingDressing('+args+');parent.document.querySelector("#render").dataset.clock=key+" t="+(game?.t??ambient)+" density="+detailDensity;(window.__groundTimes||=[]).push(performance.now()-qaBegin);if(window.__groundTimes.length>600)window.__groundTimes.shift();}');
 const blob=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
 const probe='<script type="module">import {groundLifeReady,groundLifeStats} from "'+new URL('ground-life.js?v=livingww1c',root).href+'";setInterval(()=>{parent.document.querySelector("#render").textContent="atlas "+groundLifeStats.atlas+" · FX "+groundLifeStats.fx+" · 분대 "+groundLifeStats.groups+" · 활동 "+groundLifeStats.emitters+" · "+(parent.document.querySelector("#render").dataset.clock||"")},500);groundLifeReady.then(ok=>{parent.document.querySelector("#assets").textContent="지상 atlas: "+(ok?"로드 완료":"로드 실패")});<\/script>';
 const cors='<script>window.Image=class extends Image{constructor(...args){super(...args);this.crossOrigin="anonymous"}};<\/script>';
 let html=text.replace('<head>','<head><base href="'+root.href+'">'+cors).replace(appPath,blob).replace('</body>',probe+'</body>');
 // The comparison version stays pinned; the app's deploy-version reload is
 // irrelevant inside a srcdoc verification fixture.
 html=html.replace(/<script>fetch\('version.txt'[\s\S]*?<\/script>/,'');
 html=html.replace("catch(e){if(!sessionStorage", "catch(e){console.error('Ground QA boot',e);parent.document.querySelector('output').textContent='BOOT ERROR: '+e.message;if(!sessionStorage");
 frame.srcdoc=html;
}
document.querySelector('#before').onclick=()=>loadVersion('before');document.querySelector('#after').onclick=()=>loadVersion('after');
frame.onload=()=>{const check=setInterval(()=>{if(api()){status.textContent='준비 완료 · '+mode;clearInterval(check)}},300)};
loadVersion('after').catch(e=>{status.textContent='프리뷰 로딩 실패: '+e.message});
</script>
