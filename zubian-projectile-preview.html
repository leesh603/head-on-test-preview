<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#0d2430;color:#dfe8ea;font-family:monospace}canvas{display:block}</style></head><body>
<canvas id="cv" width="960" height="560"></canvas>
<script type="module">
import {fx,fxReady,fxArtReady} from './fx-art.js';
import {drawEnemyProjectile} from './projectiles.js';
const c=document.getElementById('cv').getContext('2d');
function label(t,x,y){c.fillStyle='#cfd8da';c.font='15px monospace';c.textAlign='left';c.fillText(t,x,y)}
await fxArtReady;
// sea-ish background
c.fillStyle='#0d2430';c.fillRect(0,0,960,560);
for(let i=0;i<900;i++){c.fillStyle='rgba(120,160,175,'+(Math.random()*.05)+')';c.fillRect(Math.random()*960,Math.random()*560,3,2)}
c.imageSmoothingEnabled=false;
// 1) zubian-shell == standard enemy fighter tracer (all boss projectiles now)
label('1) 측면포탄 zubian-shell (지금: 일반 적기탄 예광)',40,50);
for(const [px,py,vx,vy] of [[150,110,60,18],[400,80,80,-10],[650,140,55,30]]){c.save();c.translate(px,py);c.scale(3,3);drawEnemyProjectile(c,{enemy:true,life:1,visualType:'fighter',vx,vy},0,0,0,1);c.restore();}
// 2) torpedo-charge = torpedo sprite + wakeFast asset
label('2) 돌진 어뢰 torpedo-charge (어뢰 스프라이트 + 물보라)',40,210);
c.save();c.translate(340,250);c.rotate(Math.atan2(10,140));fx(c,'wakeFast',-46,0,110,26,0,.5);if(!fx(c,'torpedo',0,0,64,20,0,.96))drawEnemyProjectile(c,{enemy:true,life:1,visualType:'boss',vx:140,vy:10},0,0,0,3);c.restore();
// 3) zubian-mortar marker rings (dashed circle telegraph + splash)
label('3) 박격포 마커 zubian-mortar (점선 원 + 물보라폭발)',40,330);
function ring(x,y,r,col){c.strokeStyle=col;c.lineWidth=2.5;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.stroke()}
c.setLineDash([8,6]);c.strokeStyle='#8bd0d199';c.beginPath();c.arc(300,400,90*.72,0,Math.PI*2);c.stroke();
c.strokeStyle='#e9c083';c.beginPath();c.arc(300,400,90,0,Math.PI*2);c.stroke();c.setLineDash([]);
fx(c,'splashShell',300,400,120,120,0,.95);
c.setLineDash([8,6]);c.strokeStyle='#8bd0d199';c.beginPath();c.arc(560,400,60*.72,0,Math.PI*2);c.stroke();
c.strokeStyle='#e9c083';c.beginPath();c.arc(560,400,60,0,Math.PI*2);c.stroke();c.setLineDash([]);
// 4) charge-warning dashed line (bow ram telegraph, 810px)
label('4) 돌진 예고선 charge-warning (810px 주황 점선 — 삭제 여부 확인 필요)',40,500);
c.strokeStyle='#ffce80';c.setLineDash([8,6]);c.beginPath();c.moveTo(340,520);c.lineTo(880,540);c.stroke();c.setLineDash([]);
window.__done=true;
</script></body></html>
