<!doctype html><meta charset="utf-8"><title>cowling preview</title><link rel="icon" type="image/svg+xml" href="favicon.svg?v=r5"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=r5"><link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=r5"><link rel="apple-touch-icon" href="favicon-180.png?v=r5">
<style>body{background:#3d4a52;margin:0;font-family:sans-serif;color:#eee}canvas{display:block}</style>
<canvas id="c" width="1080" height="460"></canvas>
<script>
const cv=document.getElementById('c'),c=cv.getContext('2d');
const fokker=new Image();fokker.src='./fokker.webp';
const icon=new Image();icon.src='./relic-sacred-cowling128.webp';
const S=3.2; // display scale of the decal-space (game pixels)
function plane(px,py){ // sprite nose-up -> nose right (matches game.a=0)
 c.save();c.translate(px,py);c.rotate(-Math.PI/2);c.imageSmoothingEnabled=false;
 c.drawImage(fokker,-72*.54*S,-76*.54*S,144*.54*S,160*.54*S);c.restore();
}
function decalSpace(px,py){c.save();c.translate(px,py);c.scale(S,S);c.lineJoin='round'}
function A(){ // current in-game code
 decalSpace(150,230);c.globalAlpha=.8;c.lineWidth=1.4;c.strokeStyle='#2c241c';
 for(const side of [-1,1]){c.fillStyle='#e9e4d0';c.beginPath();c.ellipse(25,side*7.5,5.2,3.4,side*-.25,0,Math.PI*2);c.fill();c.stroke();c.fillStyle='#201a12';c.beginPath();c.arc(26.5,side*7.5,1.8,0,Math.PI*2);c.fill();c.strokeStyle='#e8d7b4';c.lineWidth=2;c.beginPath();c.moveTo(23,side*3.5);c.quadraticCurveTo(18,side*8,11,side*10.5);c.stroke();c.strokeStyle='#2c241c';c.lineWidth=1.4}
 c.restore();
}
let faceDecal=null;
function buildFaceDecal(){ // icon -> white face marks only (green cowl removed)
 const s=document.createElement('canvas');s.width=icon.naturalWidth;s.height=icon.naturalHeight;const sc=s.getContext('2d',{willReadFrequently:true});
 sc.drawImage(icon,0,0);const d=sc.getImageData(0,0,s.width,s.height),px=d.data,w=s.width,h=s.height,cx=w/2;
 for(let i=0;i<px.length;i+=4){const x=(i/4)%w,y=(i/4)|0,r=px[i],g=px[i+1],b=px[i+2];
  const face=y<h*.62&&Math.abs(x-cx)<w*.46; // face marks live in the upper band
  const white=Math.min(r,g,b)>150, dark=Math.max(r,g,b)<80;
  px[i+3]=face&&(white||dark)?px[i+3]:0}
 sc.putImageData(d,0,0);return s;
}
function B(){ // extracted white face marks, icon "up" -> nose
 decalSpace(450,230);
 c.save();c.translate(24,0);c.rotate(Math.PI/2);c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
 c.drawImage(faceDecal,-13,-13,26,26);c.restore();c.restore();
}
function C(){ // original layout: horizontal eyes + horizontal brows, no moustache
 decalSpace(750,230);c.globalAlpha=.85;
 for(const s of [-1,1]){
  // brow: horizontal stroke (spans wing-axis), forward of the eye
  c.strokeStyle='#efe6c8';c.lineWidth=2.6;c.beginPath();c.moveTo(29,s*4.2);c.lineTo(28.2,s*11.2);c.stroke();
  // eye: horizontally wide (spans wing-axis), dark pupil
  c.fillStyle='#efe9d8';c.beginPath();c.ellipse(23.5,s*7.6,2.4,4.6,0,0,Math.PI*2);c.fill();
  c.fillStyle='#161310';c.beginPath();c.ellipse(24.4,s*7.6,1.5,2.6,0,0,Math.PI*2);c.fill();
  c.fillStyle='#f6f0dd';c.beginPath();c.arc(24.9,s*7,.65,0,Math.PI*2);c.fill();
 }
 c.restore();
}
fokker.onload=icon.onload=()=>{
 c.clearRect(0,0,1080,460);
 plane(150,230);plane(450,230);plane(750,230);A();B();C();
 c.fillStyle='#f4ecd8';c.font='bold 22px sans-serif';c.textAlign='center';
 c.fillText('A · 현재',150,430);c.fillText('B · 원본 이미지',450,430);c.fillText('C · 수정안',750,430);
 c.font='15px sans-serif';c.fillStyle='#cdd6c4';
 c.fillText('눈+수염 선만',150,452);c.fillText('레전더리 아이콘 그대로',450,452);c.fillText('가로눈+가로눈썹 · 수염 없음',750,452);
 window.__done=true;
};
</script>
