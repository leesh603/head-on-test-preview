<!doctype html><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="favicon.svg?v=ui2"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=ui2"><link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=ui2"><link rel="apple-touch-icon" href="favicon-180.png?v=ui2"><style>
body{background:#14181c;color:#ddd;font:14px system-ui;margin:16px}
canvas{background:#222;display:block}
</style>
<canvas id="c"></canvas>
<script>
const ATLAS_W=768,ATLAS_H=307;
const cellW=ATLAS_W/5,cellH=ATLAS_H/2;
const cellOf=c=>({x:(c%5)*cellW,y:Math.floor(c/5)*cellH,w:cellW,h:cellH});
const R=[
 ['0 전원 지대',0,'gen-rural.png'],
 ['1 아드리아해',1,'gen-sea.png'],
 ['2 참호 전선',2,'gen-trenches.png'],
 ['3 포화의 참호전선',9,'gen-burning.png'],
 ['4 도심',4,'gen-city.png'],
 ['5 고공 전역',3,'gen-sky.png'],
 ['6 알프스',5,'gen-alps.png'],
];
const TILE=380,GAP=14,LABEL=22;
const c=document.getElementById('c');
c.width=(TILE*2+GAP*3);c.height=R.length*(TILE+LABEL+GAP)+GAP+10;
const atlas=new Image();
const ims={};
let pending=1+R.length;
const done=()=>{if(--pending===0)draw()};
atlas.onload=done;atlas.src='./terrain-alps-atlas.webp';
R.forEach(([name,cell,file])=>{
 const im=new Image();im.onload=done;im.src='./mapgen/'+file;ims[name]=im;
});
function draw(){
 const g=c.getContext('2d');
 g.fillStyle='#1a2027';g.fillRect(0,0,c.width,c.height);
 g.fillStyle='#9fb3c8';g.font='600 13px system-ui';
 g.fillText('기존 (아틀라스 셀 ~154px)',GAP,16);
 g.fillText('신규 (1024→768 타일)',GAP*2+TILE,16);
 R.forEach((r,i)=>{
  const [name,cell,file]=r;
  const y=GAP+10+i*(TILE+LABEL+GAP);
  const cr=cellOf(cell);
  const blit=(im,sx,sy,sw,sh,x)=>{g.save();g.beginPath();g.rect(x,y,TILE,TILE);g.clip();g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(im,sx,sy,sw,sh,x,y,TILE,TILE);g.restore();g.strokeStyle='#3a4550';g.strokeRect(x+.5,y+.5,TILE,TILE)};
  blit(atlas,cr.x+2,cr.y+2,cr.w-4,cr.h-4,GAP);
  const im=ims[name];
  if(im.naturalWidth)blit(im,0,0,im.naturalWidth,im.naturalHeight,GAP*2+TILE);
  g.fillStyle='#cfd8e3';g.font='13px system-ui';
  g.fillText(`${name}`,GAP,y+TILE+15);
 });
}
</script>
