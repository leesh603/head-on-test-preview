<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>asset-bank — 후보 스프라이트</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#1a1d23;color:#e8e4d8;padding:14px}
  h1{font-size:20px;margin-bottom:4px}
  .sub{color:#9a9587;font-size:13px;margin-bottom:18px}
  h2{font-size:16px;margin:20px 0 10px;color:#d8b96a;border-bottom:1px solid #3a3f4a;padding-bottom:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card{background:#23272f;border:1px solid #3a3f4a;border-radius:8px;padding:8px;text-align:center}
  .card img{width:100%;max-height:150px;object-fit:contain;
    background:repeating-conic-gradient(#2e3340 0% 25%,#23272f 0% 50%) 0 0/20px 20px;border-radius:4px}
  .name{font-size:12px;margin-top:6px;line-height:1.3}
  .meta{font-size:10px;color:#8b8698;margin-top:2px}
  .boss .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .boss .card img{max-height:200px}
</style>
</head>
<body>
<h1>asset-bank — 신규 후보 스프라이트</h1>
<div class="sub">게임 미적용 스톡. 확인 후 골라주면 배선.</div>
<div id="root">불러오는 중…</div>
<script>
fetch('./manifest.json').then(r=>r.json()).then(m=>{
  const root=document.getElementById('root');root.innerHTML='';
  const LABEL={planes:'기체',aces:'에이스기',bosses:'보스 후보'};
  for(const cat of Object.keys(m.categories)){
    const sec=document.createElement('section');
    sec.className=cat==='bosses'?'boss':'';
    sec.innerHTML='<h2>'+(LABEL[cat]||cat)+' ('+m.categories[cat].length+')</h2>';
    const g=document.createElement('div');g.className='grid';
    for(const e of m.categories[cat]){
      const c=document.createElement('div');c.className='card';
      const meta=[e.nation,e.role,e.ace,e.year].filter(Boolean).join(' · ');
      c.innerHTML='<img loading="lazy" src="./'+e.file+'" alt="'+e.name+'">'+
        '<div class="name">'+e.name+'</div>'+
        '<div class="meta">'+meta+'</div>';
      g.appendChild(c);
    }
    sec.appendChild(g);root.appendChild(sec);
  }
}).catch(e=>{document.getElementById('root').textContent='manifest 로드 실패: '+e});
</script>
</body>
</html>
