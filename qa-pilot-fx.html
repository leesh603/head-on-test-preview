<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEAD-ON 파일럿 FX 실제 전후 비교</title>
<style>body{margin:0;background:#171c1b;color:#ece5d3;font:14px system-ui}header{padding:14px 20px}h1{font-size:19px;margin:0 0 8px}button,select{font:inherit;padding:8px;background:#303b36;color:inherit;border:1px solid #68705f;border-radius:5px}main{display:flex;gap:16px;justify-content:center}section{width:390px}h2{font-size:14px}iframe{width:390px;height:700px;border:1px solid #666}#status{margin:8px 0;min-height:20px}small{color:#bbb}label{margin-right:10px}</style>
<header><h1>파일럿 FX · 실제 게임 엔진 전후 비교</h1><label>장면 <select id="scene"><option value="fonck-passive">퐁크 · 정밀 조준</option><option value="fonck-active">퐁크 · 액티브 사격</option><option value="rickenbacker-passive">리켄배커 · 표적 전환</option><option value="rickenbacker-active">리켄배커 · 액티브 유지 확인</option><option value="ball-passive">볼 · 단독 비행</option><option value="ball-active">볼 · 은폐</option><option value="ball-release">볼 · 은폐 종료 (발사 없음)</option><option value="ball-ambush">볼 · 은폐 후 기습</option></select></label><label>전장 <select id="region"><option value="0">전원</option><option value="1">바다</option><option value="15">야간</option></select></label><button id="prepare" disabled>동일 조건 재현</button> <button id="step">0.06초 진행</button><div id="status">두 게임 로딩 중…</div><small>실제 엔진·원화·HUD. 표적 배치·발동 조건을 고정한 Test Lab 촬영이며 자연 플레이와 구분합니다.</small></header>
<main><section><h2>BEFORE · main 8b6d10a</h2><iframe id="before" title="변경 전 실제 게임"></iframe></section><section><h2>AFTER · 파일럿 FX 개선</h2><iframe id="after" title="변경 후 실제 게임"></iframe></section></main>
<script>
const $=id=>document.getElementById(id),frames=[$('before'),$('after')];let apis=[],games=[];
frames[0].src='./qa-pilot-before.html?headonTest=1&autostart=0';frames[1].src='./qa-pilot-after.html?headonTest=1&autostart=0';
function status(){ $('status').textContent='재현 완료 · '+games.map((g,i)=>(i?'후':'전')+' HP '+g.hp.toFixed(1)+' · 집중 '+(g.pilotIdentity?.focus||0).toFixed(2)+' · 전환 '+(g.pilotIdentity?.switches||0)+' · 은폐 '+(g.ballCloak||0).toFixed(2)+' · 탄 '+g.bullets.length+' · FX '+apis[i].equipmentInspect().keys.filter(k=>k[1]).length+'/6').join(' / ');}
function target(g,x,y){g.spawnEnemy('bomber');const e=g.enemies.at(-1);Object.assign(e,{x:g.x+x,y:g.y+y,a:-Math.PI/2,fire:Infinity,hp:10000,maxHp:10000,speed:0});(g.qaTargets??=[]).push({e,x,y});return e;}
function step(g,fire=false,dt=.02){for(const v of g.qaTargets||[]){v.e.x=g.x+v.x;v.e.y=g.y+v.y;v.e.a=-Math.PI/2;}g.state='playing';g.update(dt,{inputMode:'gamepad',fireHeld:fire,angle:-Math.PI/2});g.state='paused';}
async function advance(time,fire=false){for(let t=0;t<time-.001;t+=.02){games.forEach(g=>step(g,fire));if(Math.round(t*50)%3===0)await new Promise(requestAnimationFrame);}}
function hit(g,e){g.bullets.push({x:e.x,y:e.y,vx:0,vy:0,life:.1,enemy:false,ownerId:g.id||'p1',gun:0,identityGun:true,damage:1,hit:new Set()});step(g);}
$('prepare').onclick=async()=>{ $('prepare').disabled=true;$('status').textContent='실제 상태 재현 중…';try{
 const [pilot,phase]=$('scene').value.split('-');games=apis.map((api,i)=>{const win=frames[i].contentWindow,old=win.Math.random;win.Math.random=()=>.5;api.start({pilot,region:Number($('region').value),invincible:false,freeze:true});win.Math.random=old;const g=api.debug();g.rng=()=>.5;
 for(const k of ['spawn','eventTimer','nextBossAt','nextHeavyAt','flakTimer','regionThreat','fieldUnitTimer','gasTimer','gustTimer','patrolTimer','supplyTimer','allyTimer'])g[k]=Infinity;
 g.enemies.length=0;g.bullets.length=0;g.drops.length=0;g.allies.length=0;g.x=g.y=0;g.a=-Math.PI/2;g.need=Infinity;
 if(pilot==='fonck')target(g,0,-185);if(pilot==='rickenbacker'){target(g,-95,-240);target(g,95,-220);target(g,0,-290);}return g;});
 while(frames.some(f=>!f.contentDocument.getElementById('regionTransition').classList.contains('hidden')))await new Promise(requestAnimationFrame);
 await advance(pilot==='fonck'?1.8:.6);
 if(pilot==='rickenbacker')for(let i=0;i<3;i++){games.forEach(g=>hit(g,g.qaTargets[i].e));await advance(.08);}
 if(phase==='active'||phase==='ambush'||phase==='release'){games.forEach(g=>{g.state='playing';g.skill();g.state='paused'});await advance(pilot==='ball'?(phase==='ambush'||phase==='release'?1.6:.5):.25);}
 if(phase==='active'&&pilot!=='ball'||phase==='ambush'||phase==='passive'&&pilot==='ball'){games.forEach(g=>g.fire=0);await advance(.02,true);}
 games.forEach(g=>g.events.length=0);status();
 }catch(e){$('status').textContent='오류: '+e.message;console.error(e)}finally{$('prepare').disabled=false}};
$('step').onclick=async()=>{await advance(.06);status()};
Promise.all(frames.map(f=>new Promise(resolve=>{const timer=setInterval(()=>{const api=f.contentWindow?.__HEADON_TEST__;if(api){clearInterval(timer);resolve(api)}},200)}))).then(a=>{apis=a;$('prepare').disabled=false;$('status').textContent='준비 완료 · 장면 선택 후 재현';});
</script></html>
