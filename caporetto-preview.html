<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEAD-ON · 카포레토 개발 시안</title>
<style>body{margin:0;background:#172027;color:#e5e8e6;font:14px system-ui}header{padding:14px 18px;border-bottom:1px solid #45524e}h1{margin:0 0 6px;font-size:20px}p{margin:5px 0;color:#abb9ba}nav{display:flex;flex-wrap:wrap;gap:7px;padding:10px}button,select{padding:8px;border:1px solid #586963;border-radius:5px;color:#e4e9e6;background:#2c3b3b}button:focus{outline:2px solid #cbb783}#stage{max-width:100%;overflow:auto}canvas{display:block;max-width:100%;height:auto;touch-action:none}#status{padding:10px;white-space:pre-wrap}label{padding:6px}#note{max-width:900px}</style>
<header><h1>카포레토 · 이손초 계곡,1917</h1><p id="note">본게임용 시각 개발판 · 기존18개 맵/보스/전투는 변경하지 않습니다. 유한 계곡이며 강·도로를 반복하거나 반전하지 않습니다.</p></header>
<nav><button id="pc">PC1280×800</button><button id="mobile">모바일390×844</button><button id="play">카메라 이동</button><button id="upper">상류 석교</button><button id="lower">하류 석교</button><button id="north">북쪽 경계</button><button id="south">남쪽 경계</button><button id="native">원본1:1</button><button id="world">게임배율1.5</button><label><input id="grade" type="checkbox" checked>대기 원근</label><label><input id="overlay" type="checkbox">위치 메타데이터</label><button id="sweep">연속 이동 검수</button></nav>
<div id="stage"><canvas width="1280" height="800" id="map"></canvas></div><div id="status">원화와 실제 게임 기체 준비 중…</div>
<script type="module">
import{CAPORETTO_MAP,CAPORETTO_LANDMARKS}from'./caporetto-map-profile.js';import{CaporettoTerrain,caporettoWorldToScreen}from'./caporetto-terrain.js';import{planeSprite,paintedReady}from'./aircraft.js?v=outline2&art=pilot-recovery2&pf=1027&crewbake=1&rim=idle&decode=1';import{drawCaporettoDecor}from'./caporetto-placement.js';
const decorImages={};
const cv=document.querySelector('canvas'),ctx=cv.getContext('2d'),status=document.querySelector('#status'),terrain=new CaporettoTerrain();let center={x:CAPORETTO_MAP.width/2,y:CAPORETTO_MAP.height*.48},moving=false,last=performance.now(),elapsed=0,frames=0,total=0,max=0,lastResult=null,ready=false;
function paint(){const t=performance.now(),r=terrain.draw(ctx,center,cv.width,cv.height,{atmosphere:document.querySelector('#grade').checked});lastResult=r;drawCaporettoDecor(ctx,r.camera,terrain.map,decorImages);const k=terrain.map.worldScale;if(document.querySelector('#overlay').checked){for(const p of CAPORETTO_LANDMARKS){const q=caporettoWorldToScreen(p.x*k,p.y*k,r.camera);ctx.strokeStyle='#d9bc79';ctx.lineWidth=1;ctx.strokeRect(q.x-26,q.y-14,52,28);ctx.fillStyle='#fff1c7';ctx.font='12px sans-serif';ctx.fillText(p.label,q.x+30,q.y);}}
// Actual existing renderer/sprites, no substitute silhouettes; sprite size is
// independent of source-pixel map calibration and equals ordinary combat scale.
const px=cv.width*.5,py=cv.height*.5;planeSprite(ctx,px+14,py+22,-Math.PI/2,'fokker_red',.9,false,true);planeSprite(ctx,px,py,-Math.PI/2,'fokker_red',.9,false,false);planeSprite(ctx,px-95,py+105,-Math.PI*.42,'camel',.85,true,false);planeSprite(ctx,px+100,py-110,-Math.PI*.58,'albatros',.85,true,false);
ctx.fillStyle='#101d22cc';ctx.fillRect(12,12,Math.min(cv.width-24,480),55);ctx.fillStyle='#f0eee0';ctx.font='14px system-ui';ctx.fillText('CAPORETTO · 비행 시각 검수 / 전투 미활성',22,34);ctx.font='11px system-ui';ctx.fillText(`원본887×1774 · 월드배율${k} · ${cv.width}×${cv.height}`,22,53);
const ms=performance.now()-t;frames++;total+=ms;max=Math.max(max,ms);status.textContent=`${terrain.state==='ready'?'원화 로드 완료':'원화 로드 실패'} / 유한 좌표 ${r.camera.x.toFixed(1)}, ${r.camera.y.toFixed(1)} / 지형 drawImage ${r.imageDraws}회\n${frames}프레임 · 평균 그리기 ${(total/frames).toFixed(2)}ms · 최대 ${max.toFixed(2)}ms (이 브라우저 진단, 실제 기기 성능 보장 아님)\n강·도로는 연속 원본의 고정 위치입니다. 가장자리는 카메라 제한/레터박스로 처리하며, 새로운 비행경계·충돌·임무는 아직 활성화하지 않습니다.`;}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(moving){elapsed+=dt;const k=terrain.map.worldScale;center={x:terrain.map.width*(.5+.09*Math.sin(elapsed*.13)),y:terrain.map.height*(.5+.48*Math.sin(elapsed*.13))};}if(ready&&moving)paint();requestAnimationFrame(frame);}
function jump(x,y){moving=false;center={x:x*terrain.map.worldScale,y:y*terrain.map.worldScale};paint();}
for(const[id,w,h]of[['pc',1280,800],['mobile',390,844]])document.querySelector('#'+id).onclick=()=>{cv.width=w;cv.height=h;paint();};document.querySelector('#play').onclick=()=>{moving=!moving;document.querySelector('#play').textContent=moving?'카메라 정지':'카메라 이동';};document.querySelector('#upper').onclick=()=>jump(456,381);document.querySelector('#lower').onclick=()=>jump(420,1128);document.querySelector('#north').onclick=()=>jump(443,0);document.querySelector('#south').onclick=()=>jump(443,1774);
for(const[id,k]of[['native',1],['world',1.5]])document.querySelector('#'+id).onclick=()=>{const old=terrain.map.worldScale;center={x:center.x/old*k,y:center.y/old*k};terrain.map={...CAPORETTO_MAP,worldScale:k,width:887*k,height:1774*k};paint();};
document.querySelector('#sweep').onclick=async()=>{moving=false;let n=0,errors=[];for(const[w,h]of[[1280,800],[390,844]]){cv.width=w;cv.height=h;for(let i=0;i<=80;i++){center={x:terrain.map.width*(.5+.12*Math.sin(i/8)),y:terrain.map.height*i/80};paint();const c=lastResult.camera;if(!Number.isFinite(c.x+c.y)||!lastResult.drawn||lastResult.imageDraws!==1)errors.push(i);n++;await new Promise(requestAnimationFrame);}}status.textContent=`검수 완료 ${n}위치 / 오류 ${errors.length}. PC·모바일 연속 좌표, 한 장 원화 이동. 평균 ${(total/frames).toFixed(2)}ms 최대 ${max.toFixed(2)}ms`;};
for(const id of ['grade','overlay'])document.querySelector('#'+id).onchange=()=>paint();
const a=await Promise.all([terrain.prepare(),paintedReady('fokker_red'),paintedReady('camel'),paintedReady('albatros'),...['props.webp','hut.webp'].map(src=>new Promise(resolve=>{const im=new Image();im.onload=()=>{decorImages[src]=im;resolve(true);};im.onerror=()=>resolve(false);im.src='./asset-bank/maps/caporetto/'+src;}))]);ready=a[0];status.textContent=ready?'준비 완료':'원화 로드 실패';paint();requestAnimationFrame(frame);addEventListener('pagehide',e=>{moving=false;if(!e.persisted){ready=false;terrain.dispose();}});addEventListener('pageshow',async()=>{if(terrain.state!=='ready'){ready=await terrain.prepare();}if(ready)paint();});
</script>
