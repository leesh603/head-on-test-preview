<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>HEAD-ON 특수미션 검증</title>
<style>
body{font:15px system-ui;background:#161d23;color:#eee;margin:16px}button{margin-right:8px;padding:8px}canvas{display:block;background:#34474b;border:1px solid #837051;margin-top:10px;max-width:100%}pre{white-space:pre-wrap}
</style>
<h1>특수미션 PC·모바일 검증</h1>
<button id="pc">PC 검증</button><button id="mobile">모바일 검증</button>
<pre id="report" role="status">검증 모듈 로딩 중</pre>
<canvas id="scene"></canvas>
<script type="module">
import {Game} from './engine.js?v=09c75d146ae4289d';
import {enableStageBoss} from './stageboss-host.js?v=09c75d146ae4289d';
import {operationMissionCard} from './special-operation-combat.js?v=special-ops-1c861d64';
import {drawOperationTargets,drawSpecialOperationTrain} from './special-operation-view.js?v=special-ops-1c861d64';
const report=document.querySelector('#report'),scene=document.querySelector('#scene'),ctx=scene.getContext('2d');
const check=(cond,message)=>{if(!cond)throw new Error(message)};
function run(mobile){
 const rows=[];
 scene.width=mobile?390:1280;scene.height=mobile?740:720;
 for(const [id,map,win] of [['prototype',4,true],['cargo',8,true],['squadron',2,true],['ace',6,true],['prototype',4,false]]){
  let seed=1918;
  const game=new Game('fokker','baron',()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296));
  game.specialOperations=true;game.viewWidth=scene.width;game.viewHeight=scene.height;
  const addon=enableStageBoss(game,{teamFaction:'central'}),stages=addon.stages;
  stages.orderPosition=4;stages.stageIndex=stages.order[3];stages.phase='operation-offer';
  stages.operation={phase:'offer',choices:[{id,stageIndex:map}]};
  addon.hooks.onStageChange(stages.selectOperation(id));game.need=Infinity;game.invuln=100;
  game.update(.04,{angle:-Math.PI/2,inputMode:'gamepad',fireHeld:false});
  const battle=game.operationBattle,card=operationMissionCard(game,false);
  check(battle.wave===1&&card?.objective,'첫 공세/임무 카드 미표시 '+id);
  ctx.clearRect(0,0,scene.width,scene.height);
  drawSpecialOperationTrain(ctx,game,scene.width,scene.height);
  drawOperationTargets(ctx,game,scene.width,scene.height);
  for(let i=0;i<2400&&game.state==='playing';i++){
   const objective=battle.patrols.find(p=>p.hp>0&&!p.operationRallied)
    ||battle.patrols.find(p=>p.hp>0&&!p.operationEvacuated)||battle.train?.cargo;
   if(objective){game.x=objective.x;game.y=objective.y+145;}
   if(!win){
    objective.invuln=0;
    game.bullets.push({x:objective.x,y:objective.y,vx:0,vy:0,life:1,damage:600,enemy:true,ownerId:'p1',hit:new Set()});
   }else{
    for(const patrol of battle.patrols)patrol.invuln=1;
    for(const e of battle.enemies)if(e.hp>0&&!e.expired&&e.operationRailCar!=='cargo')
     game.bullets.push({x:e.x,y:e.y,vx:0,vy:0,life:1,damage:650,enemy:false,ownerId:'p1',hit:new Set()});
   }
   game.invuln=1;game.update(.04,{angle:-Math.PI/2,inputMode:'gamepad',fireHeld:false});
  }
  const result=game.operationResult;
  check(game.state==='operation-result'&&result?.result===(win?'succeeded':'failed'),id+' 결과 불일치 '+JSON.stringify({state:game.state,result,elapsed:battle.elapsed}));
  check(game.worldRegion()===stages.order[stages.orderPosition],id+' 일반 전장 복귀 실패');
  if(win){
   check(result.reward,id+' 보상 미지급');
   if(id==='prototype')check(battle.testLeg===3,'검문점 누락');
   if(id==='squadron')check(battle.evacuated>=3,'편대기 탈출 부족');
   if(id==='ace')check(battle.repair===4,'재시동 누락');
   if(id==='cargo')check(battle.train.secured>=3&&battle.train.cargo.hp>0,'화물 확보 미완료');
  }
  rows.push(id+' '+result.result+' · '+battle.elapsed.toFixed(1)+'s · '+card.objective);
 }
 report.textContent=(mobile?'모바일 390px':'PC 1280px')+'\n'+rows.join('\n')+'\nPASS · 5개 시나리오';
}
for(const [id,mobile] of [['pc',false],['mobile',true]])document.querySelector('#'+id).onclick=()=>{
 try{run(mobile);}catch(error){report.textContent='FAIL · '+error.stack;}
};
report.textContent='검증 모듈 준비 완료';
</script>
</html>
