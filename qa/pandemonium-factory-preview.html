<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이동 군수공장 · 독립 전투 시험</title><style>*{box-sizing:border-box}body{margin:0;background:#17201c;color:#e6e4d8;font:14px system-ui}header{height:138px;padding:8px 12px;background:#101612;overflow:hidden}h1{font-size:16px;margin:0 0 6px}button{padding:6px 10px;border:1px solid #657264;border-radius:4px;background:#263529;color:inherit;margin:2px;cursor:pointer}button:disabled{opacity:.4}#status{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}canvas{display:block;width:100vw;height:calc(100dvh - 138px);touch-action:none}#error{color:#ffb59a}@media(max-width:500px){header{height:206px;padding:8px}h1{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}button{font-size:11px;padding:6px 7px;margin:2px}canvas{height:calc(100dvh - 206px)}#status{font-size:10px;white-space:normal;max-height:28px}} </style><header><h1>공장형 · 동력·보급·조준 개선 검수</h1><div><button id="pause">일시정지</button><button id="reset">초기화</button><button id="line">생산라인 파괴</button><button id="boiler">보일러 파괴</button><button id="gun">포대 파괴</button><button id="tracks">주행부 파괴</button><button id="core">코어 격파</button><button id="half">보일러 50%</button><button id="crane">크레인 파괴</button><button id="supply">보급 시험</button><button id="fps">4 FPS 시험</button><button id="down">표적 다운</button><button id="snapshot">스냅샷 복원</button><button id="record">녹화 시작</button><button id="stop" disabled>녹화 저장</button></div><div id="status">에셋 준비 중 · 부위를 눌러 100 피해</div><span id="error"></span></header><canvas id="view"></canvas><script type="module">
import{createBoss,updateBoss,damagePart,listParts}from'../pandemonium-factory-mechanics.js';import{loadAssets,drawBoss}from'../pandemonium-factory-render.js';
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),status=document.querySelector('#status');let assets,s,paused=false,last=performance.now(),scale=1,recording=null,chunks=[],totalDamage=0,lowFPS=false,accumulator=0;
const players=[{id:'pilot-1',x:150,y:400,hp:100,alive:true}];
function reset(){Object.assign(players[0],{hp:100,alive:true,status:'active'});document.querySelector('#fps').textContent='4 FPS 시험';document.querySelector('#down').textContent='표적 다운';s=createBoss({entityId:'factory-preview',token:'preview-'+Date.now()});paused=false;totalDamage=0,lowFPS=false,accumulator=0;document.querySelector('#pause').textContent='일시정지';window.factory=s;}reset();
function size(){c.width=Math.round(c.clientWidth);c.height=Math.round(c.clientHeight);scale=Math.min(c.width/620,c.height/850);}addEventListener('resize',size);size();

function destroy(role){for(const p of s.parts)if(p.role===role)damagePart(s,p.id,p.hp);}function core(){damagePart(s,'boiler',9999);damagePart(s,'core',9999);}
window.factoryQA={get state(){return s},damagePart:(id,n=9999)=>damagePart(s,id,n),destroy,defeat:core,reset,setPaused:v=>paused=!!v};
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'계속':'일시정지';};document.querySelector('#reset').onclick=reset;
for(const [id,role]of[['line','production'],['boiler','boiler'],['gun','turret'],['tracks','track']])document.querySelector('#'+id).onclick=()=>destroy(role);document.querySelector('#core').onclick=core;
document.querySelector('#half').onclick=()=>damagePart(s,'boiler',150);document.querySelector('#crane').onclick=()=>destroy('crane');document.querySelector('#supply').onclick=()=>{for(const p of s.parts)if(p.role==='turret'&&p.hp>0)p.magazine=0;const crane=s.parts.find(p=>p.role==='crane');crane.cooldown=0;};document.querySelector('#fps').onclick=()=>{lowFPS=!lowFPS;accumulator=0;document.querySelector('#fps').textContent=lowFPS?'60 FPS 복귀':'4 FPS 시험';};document.querySelector('#down').onclick=()=>{players[0].alive=!players[0].alive;players[0].hp=players[0].alive?100:0;players[0].status=players[0].alive?'active':'downed';document.querySelector('#down').textContent=players[0].alive?'표적 다운':'표적 복구';};document.querySelector('#snapshot').onclick=()=>{s=JSON.parse(JSON.stringify(s));window.factory=s;};
c.onpointerdown=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left-c.width/2)/scale,y=(e.clientY-r.top-c.height/2)/scale,hit=listParts(s).filter(p=>p.hp>0).find(p=>Math.hypot(x-p.x,y-p.y)<=p.r);if(hit)damagePart(s,hit.id,100);};
document.querySelector('#record').onclick=()=>{try{chunks=[];recording=new MediaRecorder(c.captureStream(30),{mimeType:'video/webm'});recording.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recording.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});if(parent!==window){parent.postMessage({type:'factory-recording',blob},location.origin);return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='headon-factory-combat.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)};recording.start(1000);document.querySelector('#record').disabled=true;document.querySelector('#stop').disabled=false}catch(e){document.querySelector('#error').textContent=String(e)}};
document.querySelector('#stop').onclick=()=>{recording?.stop();document.querySelector('#record').disabled=false;document.querySelector('#stop').disabled=true;};
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(assets){players[0].x=Math.sin(s.time*.35)*200;players[0].y=310+Math.cos(s.time*.2)*45;if(!paused){accumulator+=dt;if(!lowFPS||accumulator>=.25){updateBoss(s,lowFPS?.25:accumulator,{players,paused:false});totalDamage+=s.damageEvents.reduce((n,e)=>n+e.damage,0);accumulator=lowFPS?Math.max(0,accumulator-.25):0;}}ctx.clearRect(0,0,c.width,c.height);drawBoss(ctx,s,assets,{width:c.width,height:c.height,scale});ctx.save();ctx.translate(c.width/2+players[0].x*scale,c.height/2+players[0].y*scale);ctx.scale(scale,scale);ctx.drawImage(assets.aircraft,-18,-22,36,44);ctx.restore();ctx.save();ctx.fillStyle='#e6e4d8';ctx.font=c.width<500?'10px system-ui':'13px system-ui';ctx.fillText(`압력 ${Math.round(s.pressure*100)}% / 코어 ${Math.ceil(s.coreHp)} / 보급 ${s.supplyCount} / 탄창 ${s.parts.filter(p=>p.role==='turret').map(p=>p.magazine).join('/')}`,8,18,c.width-16);ctx.fillText(`${lowFPS?'4 FPS':'60 FPS'} · ${players[0].alive?'활성 표적':'다운 표적'} · ${s.phase} · 대기 ${s.hazards.filter(h=>!h.fired).length} / 비행 ${s.hazards.filter(h=>h.fired).length}`,8,34,c.width-16);ctx.restore();status.textContent=`${paused?'PAUSED':s.phase} · 코어 ${Math.ceil(s.coreHp)} · 가동 ${s.parts.filter(p=>p.active).length}/${s.parts.length} · 압력 ${Math.round(s.pressure*100)}% · 탄체 ${s.hazards.length} · 탄창 ${s.parts.filter(p=>p.role==='turret').map(p=>p.magazine).join('/')} · 보급 ${s.supplyCount} · ${lowFPS?'4 FPS':'60 FPS'} · 피격 ${totalDamage}`;}requestAnimationFrame(frame)}
try{assets=await loadAssets();window.qaReady=true;requestAnimationFrame(frame)}catch(e){document.querySelector('#error').textContent=e.stack;window.qaError=String(e)}
</script></html>
