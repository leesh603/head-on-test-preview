<script type="module">
const status=document.querySelector('#status'),rows=document.querySelector('#results');
window.addEventListener('unhandledrejection',event=>{status.textContent=String(event.reason)});
document.querySelector('#run').onclick=async event=>{
 event.target.disabled=true;
 try{
  status.textContent='게임 모듈 불러오는 중';
  const [{Game},{enableStageBoss},{intrusionProfiles,forceIntrusionForTest,hitIntrusionAt},{prepareIntrusionArt}]=await Promise.all([
   import('./engine.js?v=09c75d146ae4289d'),import('./stageboss-host.js?v=09c75d146ae4289d'),import('./intrusion-bosses.js?v=09c75d146ae4289d'),import('./intrusion-boss-art.js?v=09c75d146ae4289d')
  ]);
  let passed=0,total=0;
  for(const [width,height] of [[390,844],[1280,800]]){
   for(const id of ['bastion','twin-fortress','citadel','handley-page-v1500','linke-hofmann-r-ii','uboat','qship','nachtwal']){
    const profile=intrusionProfiles[id],stageIndex=profile.stages[0],g=new Game('fokker','baron',()=>.5);
    status.textContent='검사 중 · '+id;
    await prepareIntrusionArt(id);
    Object.assign(g,{a:-Math.PI/2,viewWidth:width,viewHeight:height,fire:Infinity,spawn:Infinity,maxHp:1000,hp:1000,invuln:0});
    enableStageBoss(g,{teamFaction:profile.faction==='central'?'entente':'central'});
    Object.assign(g.stageBoss.stages,{stageIndex,orderPosition:2,phase:'explore'});
    const e=forceIntrusionForTest(g,id,{stageIndex,width,height});
    let first=null,damaged=false;
    for(let frame=0;frame<23*60;frame++){
     g.stageStartTime=g.t;g.stageStartDistance=g.distance||0;g.pendingLevelUps=[];
     g.enemies=g.enemies.filter(target=>target.intrusionBody);g.battlefieldEvents=null;g.ruralFronts=null;g.photoRecon=null;
     const turning=profile.domain==='sea'?0:Math.max(0,frame/60-6)*.6;
     g.update(1/60,{angle:-Math.PI/2+turning,inputMode:'gamepad',moveX:1,fireHeld:false});
     if(first===null&&(g.bullets.some(b=>b.intrusionEncounterId===e.encounterId&&b.damage>0)||e.hazards.some(h=>h.done&&h.age>=h.warning&&h.damage>0&&Math.abs(h.x-g.x)<width*.48&&Math.abs(h.y-g.y)<height*.48)))first=frame/60;
     if(first!==null&&!damaged){
      const part=Object.keys(e.parts).find(key=>key!=='core'&&e.parts[key].hp>0&&['engine','drive','turret','gun','armor'].some(k=>e.parts[key].kind.includes(k)));
      if(part)damaged=hitIntrusionAt(g,{partId:part,damage:e.parts[part].maxHp}).broken.includes(part);
     }
    }
    const ok=first!==null&&damaged&&Number.isFinite(e.x+e.y+e.a)&&e.hp>0;
    const row=rows.insertRow();
    for(const text of [width+'×'+height,id,first===null?'—':first.toFixed(2)+'초',ok?'통과':'실패'])row.insertCell().textContent=text;
    total++;passed+=Number(ok);
    await new Promise(requestAnimationFrame);
   }
  }
  status.textContent=passed+'/'+total+' 통과';
 }catch(error){status.textContent='검사 실패 · '+(error.stack||error);}
};
</script></html>
