<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A형 판데모니움 · 독립 작동 시험</title>
<style>*{box-sizing:border-box}body{margin:0;background:#151a1b;color:#eee6cf;font:14px system-ui}header,nav,details,footer{max-width:1280px;margin:auto;padding:10px 16px}h1{font-size:20px;margin:0 0 4px}p{margin:4px 0;color:#c2bba9}nav{display:flex;gap:7px;flex-wrap:wrap}button,select,a{font:inherit}button,select{background:#303936;border:1px solid #697066;color:#f3e8c7;border-radius:5px;padding:9px;min-height:38px;cursor:pointer}button:disabled{opacity:.4}#stage{display:block;width:min(100%,1280px);margin:auto;background:#343b35;max-height:76vh;object-fit:contain}#status{height:22px;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums}a{color:#f3c979}details div{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}footer{font-size:12px;color:#bab4a7}body.mobile #stage{width:390px;max-width:100%;max-height:none}body.mobile header,body.mobile nav,body.mobile details,body.mobile footer{max-width:390px}</style>
<header><h1>A형 · 장거리 출격 요새</h1><p>쌍거포 · 방공포 · 갑판 발진 · 크레인 재보급 · 독립 궤도</p><p id="status" role="status">원화와 효과음 준비 중…</p></header>
<nav><button id="demo" disabled>작동 시연</button><button id="record" disabled>개선 기능 40초 녹화</button><button id="pause">일시정지</button><button id="reset">초기화</button><button id="mobile">모바일 390</button><button id="pc">PC 1280</button><button id="rotation">회전 90° 검증 녹화</button><button id="lowfps">저 FPS 시험</button><button id="sound">소리 켜기</button><a id="download" hidden>녹화 다운로드</a></nav>
<canvas id="stage" width="1280" height="900" aria-label="A형 실제 렌더 캔버스"></canvas>
<details><summary>부위별 검증 · 클릭한 부위 피해</summary><div><select id="part" aria-label="대상 부위"></select><button id="hit">선택 부위 파괴</button><button id="damage">선택 부위 40 피해</button><button id="drive">궤도 기동 전환</button><button id="fire">거포 공격 예약</button><button id="launch">갑판 발진 예약</button><button id="defeat">핵심부 격파</button></div></details>
<footer>독립 시험판 · 본게임 교체/동시 3체 출현 없음. 파괴 부위의 예약은 취소되며 이미 발사된 탄과 기체는 남습니다.</footer>
<script type="module">
import {createBoss,updateBoss,damagePart,listParts,requestAttack,localToWorld} from '../pandemonium-a-mechanics.js';
import {drawBoss,loadAssets} from '../pandemonium-a-render.js';
import {createFortressAudio} from '../fortress-audio.js';
const $=id=>document.getElementById(id),cv=$('stage'),c=cv.getContext('2d'),audio=createFortressAudio();let s=createBoss(),assets=null,last=performance.now(),playing=false,elapsed=0,eventIndex=0,muted=true,recorder=null,recordTimer=null,lowfps=false,simulationDebt=0;
audio.setMuted(true);const target={id:'test-player',x:900,y:1500,hp:100,r:20};
const labels={core:'핵심부',deck:'갑판 발진',crane:'크레인 재보급','main-left':'좌 거포','main-right':'우 거포','aa-west':'서측 AA','aa-bridge':'함교 AA','aa-deck':'갑판 AA','aa-left':'좌 AA','aa-right':'우 AA','track-west':'서측 궤도','track-main-left':'좌 궤도','track-main-right':'우 궤도','track-deck-left':'갑판 좌 궤도','track-deck-mid':'갑판 중앙 궤도','track-deck-right':'갑판 우 궤도'};
for(const p of s.parts){const o=document.createElement('option');o.value=p.id;o.textContent=labels[p.id];$('part').append(o)}
const events=[[1,()=>{s.drive=-.7;s.turn=.8}],[5,()=>{s.drive=0;s.turn=0}],[9,()=>{damagePart(s,'main-left',60);damagePart(s,'crane',40);damagePart(s,'deck',60);damagePart(s,'aa-west',35)}],[10,()=>{lowfps=true}],[13,()=>{lowfps=false}],[16,()=>damagePart(s,'aa-west',999)],[18,()=>damagePart(s,'main-left',999)],[20,()=>damagePart(s,'crane',999)],[23,()=>{s.drive=.6;s.turn=-.7;damagePart(s,'track-main-left',999)}],[26,()=>{s.drive=0;s.turn=0;damagePart(s,'deck',999)}],[28,()=>{for(const p of s.parts.filter(p=>p.role==='track'))damagePart(s,p.id,999)}],[32,()=>damagePart(s,'core',999)]];
function reset(){target.x=-166;target.y=1800;lowfps=false;simulationDebt=0;s=createBoss({entityId:'asymmetric-qa',token:'run-'+Date.now()});elapsed=0;eventIndex=0;playing=false;$('pause').textContent='일시정지'}
async function unlock(){muted=false;audio.setMuted(false);const ok=await audio.unlock();if(!ok)throw new Error('효과음 준비 실패');$('sound').textContent='소리 끄기'}
async function start(){await unlock();reset();playing=true}
$('demo').onclick=start;$('reset').onclick=reset;$('pause').onclick=()=>{s.paused=!s.paused;$('pause').textContent=s.paused?'계속':'일시정지'};
$('mobile').onclick=()=>{document.body.classList.add('mobile');cv.width=390;cv.height=760};$('pc').onclick=()=>{document.body.classList.remove('mobile');cv.width=1280;cv.height=900};
$('sound').onclick=async()=>{if(muted)await unlock();else{muted=true;audio.setMuted(true);$('sound').textContent='소리 켜기'}};
$('lowfps').onclick=()=>{lowfps=!lowfps;$('lowfps').textContent=lowfps?'2 FPS 시뮬레이션 중':'저 FPS 시험'};
$('hit').onclick=()=>damagePart(s,$('part').value,999);$('damage').onclick=()=>damagePart(s,$('part').value,40);$('defeat').onclick=()=>damagePart(s,'core',999);$('drive').onclick=()=>s.drive=s.drive?0:-.7;
function queue(role){for(const p of s.parts.filter(p=>p.role===role))requestAttack(s,p.id)}
$('fire').onclick=()=>queue('battery');$('launch').onclick=()=>queue('deck');
function camera(){return{x:s.x,y:s.y+60}}function scale(){return Math.min(cv.width/1600,cv.height/1580)}
cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*cv.width/r.width,y=(e.clientY-r.top)*cv.height/r.height,sc=scale(),cam=camera(),wx=(x-cv.width/2)/sc+cam.x,wy=(y-cv.height/2)/sc+cam.y;const p=listParts(s).filter(p=>Math.hypot(wx-p.x,wy-p.y)<p.r).sort((a,b)=>Math.hypot(wx-a.x,wy-a.y)-Math.hypot(wx-b.x,wy-b.y))[0];if(p){$('part').value=p.id;damagePart(s,p.id,40)}};
let rotationRun=false;
$('rotation').onclick=()=>{rotationRun=true;$('record').click()};
$('record').onclick=async()=>{try{if(recorder?.state==='recording')return;await start();if(rotationRun){s.a=Math.PI/2;for(const p of s.parts.filter(p=>p.role==='battery'))p.elevation=.72;target.x=s.x-1800;target.y=s.y;playing=false;for(const p of s.parts.filter(p=>p.role==='battery'))requestAttack(s,p.id);}const duration=rotationRun?10000:40000;const filename=rotationRun?'HEADON-A-rotated-90-sound.webm':'HEADON-A-'+cv.width+'-sound.webm';rotationRun=false;const stream=cv.captureStream(30);for(const t of audio.captureStream()?.getAudioTracks()||[])stream.addTrack(t);const type=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));recorder=new MediaRecorder(stream,type?{mimeType:type}:{});const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType}),link=$('download');if(link.href.startsWith('blob:'))URL.revokeObjectURL(link.href);link.href=URL.createObjectURL(blob);link.download=filename;link.hidden=false;$('record').disabled=false;stream.getVideoTracks().forEach(t=>t.stop())};recorder.start(500);$('record').disabled=true;$('download').hidden=true;recordTimer=setTimeout(()=>{if(recorder.state==='recording')recorder.stop()},duration===10000?10000:65000)}catch(e){$('status').textContent='녹화 실패: '+e.message;$('record').disabled=false}};
function frame(now){const dt=Math.min((now-last)/1000,2);last=now;if(assets){if(playing&&!s.paused){elapsed+=dt;while(eventIndex<events.length&&elapsed>=events[eventIndex][0])events[eventIndex++][1]();if(elapsed>=40)playing=false}if(playing){const w=localToWorld(s,514,2400);target.x=w.x;target.y=w.y}simulationDebt+=dt;if(!lowfps||simulationDebt>=.5){updateBoss(s,simulationDebt,{players:[target]});simulationDebt=0}if(recorder?.state==='recording'&&s.defeat?.elapsed>=7){clearTimeout(recordTimer);recorder.stop()}audio.update(s,dt);c.fillStyle='#343b35';c.fillRect(0,0,cv.width,cv.height);drawBoss(c,s,assets,{camera:camera(),width:cv.width,height:cv.height,scale:scale()});c.fillStyle='#eee6cf';c.font=(cv.width<500?'13px':'18px')+' system-ui';c.fillText('A형  '+Math.round(s.coreHp/3)+'%  /  부위 '+s.parts.filter(p=>p.hp<=0).length+'/16',16,26);$('status').textContent=(s.defeat?'핵심부 격파 '+s.defeat.elapsed.toFixed(1)+'초':'가동 중 '+s.time.toFixed(1)+'초')+' · '+(lowfps?'2 FPS':'120 Hz')+' · 발진 '+s.sorties+' · 잔여 기체 '+s.ammo+' · '+(muted?'음소거':'소리 켜짐')}requestAnimationFrame(frame)}
requestAnimationFrame(frame);try{[assets]=await Promise.all([loadAssets(),audio.ready]);$('demo').disabled=$('record').disabled=false}catch(e){$('status').textContent=e.message}
</script></html>
