<!doctype html><meta charset="utf-8"><title>HEAD-ON boss entry QA</title><style>body{margin:0;background:#151b1b;color:#eee;font:14px sans-serif}header{padding:12px;display:flex;gap:10px}button,select{padding:8px}canvas{display:block;background:#303b35}pre{margin:10px}</style><header><label>보스 <select id="boss"></select></label><label>화면 <select id="size"><option value="1280,720">PC 1280×720</option><option value="390,844">모바일 390×844</option></select></label><button id="start">처음부터</button><button id="play">재생</button><button id="step">0.5초 진행</button><button id="approach">고정진지로 접근</button></header><pre id="status">원화 준비 중</pre><canvas id="game" width="1280" height="720"></canvas>
<script type="module">
const status=document.querySelector('#status');window.addEventListener('error',e=>status.textContent='ERROR: '+e.message);window.addEventListener('unhandledrejection',e=>status.textContent='ERROR: '+e.reason?.stack);
try{
const {StageBossAddon}=await import('./headon-stageboss-runtime.js'),{BOSS_CATALOG}=await import('./headon-stageboss-patterns.js'),{prepareStageBossAssets,drawStageBoss}=await import('./stageboss-view.js'),{bossArrivalAlpha}=await import('./boss-arrival.js');
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),select=document.querySelector('#boss');for(const [id,b]of Object.entries(BOSS_CATALOG)){const o=document.createElement('option');o.value=id;o.textContent=b.name;select.append(o)}select.value='sms-stuttgart';let g,addon,frame,playing=false;
async function start(){playing=false;const [W,H]=document.querySelector('#size').value.split(',').map(Number);canvas.width=W;canvas.height=H;const id=select.value,info=BOSS_CATALOG[id];g={};Object.assign(g,{x:0,y:0,viewWidth:W,viewHeight:H,camera:{zoom:1},enemies:[],bossCues:[],bossBuildings:[],state:'playing'});
addon=new StageBossAddon({runId:'visual-entry',teamFaction:info.faction==='central'?'entente':'central',stageIndex:info.stage,presentArrivals:true,rng:()=>.5,hooks:{getTuning:()=>({maxHp:10000,partHp:1000,damage:12,bulletSpeed:160,geometryScale:1.45,regionalViewWidth:W,regionalViewHeight:H}),onDamage(){},onStatus(){},onBarrierContact(){},spawnMinion(){return true},countMinions(){return 0},onBuildingImpact(){return true},onCue(){},onEncounterCleared(){},onStageChange(){},clearEncounterOwned(){}}});if(info.capitalFinal){addon.stages.finalArena.enabled=true;addon.stages.capitalRound=1}g.stageBoss=addon;g.region=info.stage;frame={paused:false,players:[{id:'p1',alive:true,x:0,y:120,vx:0,vy:0}],bounds:{left:-W/2,right:W/2,top:-H/2,bottom:H/2}};status.textContent='원화 준비 중';await prepareStageBossAssets(info.stage);addon.startBoss({x:0,y:-80,presentArrival:true,entryBounds:frame.bounds});addon.tick(.001,frame);draw()}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);drawStageBoss(ctx,g,canvas.width,canvas.height,{drawZeppelin(){},drawFieldArt(){}});const b=[...addon.stages.encounter.bodies.values()][0];status.textContent=JSON.stringify({boss:addon.stages.encounter.bossId,age:+(b.arrivalAge||0).toFixed(2),pending:!!b.arrivalPending,alpha:bossArrivalAlpha(b),x:+b.x.toFixed(1),y:+b.y.toFixed(1),cameraY:g.y},null,1)}
document.querySelector('#start').onclick=start;document.querySelector('#boss').onchange=start;document.querySelector('#size').onchange=start;document.querySelector('#play').onclick=()=>playing=!playing;document.querySelector('#step').onclick=()=>{for(let i=0;i<10;i++)addon.tick(.05,frame);draw()};document.querySelector('#approach').onclick=()=>{const b=[...addon.stages.encounter.bodies.values()][0];g.x=b.x;g.y=b.y;draw()};let prev=performance.now();function loop(now){const dt=Math.min(.05,(now-prev)/1000);prev=now;if(playing&&addon){addon.tick(dt,frame);draw()}requestAnimationFrame(loop)}requestAnimationFrame(loop);await start()
}catch(e){status.textContent='ERROR: '+e.stack}
</script>
