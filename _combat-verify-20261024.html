<script type="module">
import {TACTICAL_DOCTRINES,COMPOSITE_TACTICS,TACTICAL_BY_ID,selectTactical} from './tactical-doctrines.js?v=tactics20261023';
const list=[...TACTICAL_DOCTRINES,...COMPOSITE_TACTICS],el=id=>document.getElementById(id),frame=el('frame'),rows=el('results'),status=el('status');
for(const d of list)el('tactic').add(new Option(d.name,d.id));let busy=false;
const paint=()=>new Promise(requestAnimationFrame),delay=ms=>new Promise(r=>setTimeout(r,ms));
async function ready(){for(let i=0;i<1200;i++){if(frame.contentWindow.__HEADON_TEST__)return frame.contentWindow.__HEADON_TEST__;await delay(100);}throw Error('게임 모듈 준비 시간 초과');}
el('view').onchange=()=>{frame.style.width=el('view').value+'px';};
function choose(p,d){p.weaponMods={};p.weaponModSelections={};p.compositeTactic=null;p._netTacticalCombat=null;
 if(d.family){p.weaponModSelections[d.family]=5;if(!selectTactical(p,d.id))throw Error('교리 선택 거부: '+d.id);}
 else{const [a,b]=d.families,base=TACTICAL_DOCTRINES.find(x=>x.family===a);p.weaponModSelections[a]=5;if(!selectTactical(p,base.id))throw Error('기본 교리 선택 거부');p.weaponModSelections[b]=3;if(!selectTactical(p,d.id))throw Error('복합 전술 선택 거부');}
}
async function scenario(id){const api=await ready(),d=TACTICAL_BY_ID[id],coop=el('coop').checked;api.start({region:0,pilot:'baron',coop:coop?'voss':'',seed:1918,invincible:true,freeze:true});const g=api.debug();if(!g)throw Error('출격 생성 실패');
 const p=g.players?.find(p=>p.id===el('owner').value)||g.players?.[0]||g;g.enemies=[];g.bullets=[];g.combatFX=[];g.allies=[];p.a=0;p.need=Infinity;p.invuln=99999;p.rockets=2;p.mineCount=2;p.permanentWingman=3;p.fire=0;p.reloadTime=0;p.ammo.fill(p.weapon.belt);if(g.players)for(const q of g.players){q.need=Infinity;q.invuln=99999;}
 choose(p,d);p.ensureWingmen();g.state='playing';const safe=['survivalRepair','emergencyEscape','blockingBombing'].includes(id);g.battlefieldEventSpawning=true;const target=g.spawnEnemy('hunter');g.battlefieldEventSpawning=false;
 if(target)Object.assign(target,{x:p.x+(safe?1400:150),y:p.y,a:0,hp:10000,maxHp:10000,speed:0,stationary:true,missionTarget:true});const initial=target?.hp||0;
 const hurt=['survivalRepair','survivalCounter','defensiveSuppression','emergencyEscape','blockingBombing','mutualCover'].includes(id);
 if(hurt){p.invuln=0;if(g.players)g.hitPlayer(p,10);else p.hit(10);p.invuln=99999;}const injured=p.hp;
 if(id.startsWith('explosive'))p.launchUpgradeRocket();
 const seen=new Set();let maxBullets=0,healed=0,lastHp=p.hp,lowest=initial;
 for(let i=0;i<220;i++){const input={inputMode:'gamepad',fireHeld:true,angle:id==='speedDuel'?.25*Math.sin(i*.04):0};g.state='playing';g.update(.02,g.players?{p1:input,p2:input}:input);g.state='paused';
 for(const f of g.combatFX||[])if(f.ownerId===(p.id||'p1')&&f.tacticalCue)seen.add(f.tacticalCue);maxBullets=Math.max(maxBullets,g.bullets.length);healed+=Math.max(0,p.hp-lastHp);lastHp=p.hp;lowest=Math.min(lowest,target?.hp??initial);if(i%2===0)await paint();}
 const ok=seen.has(id),tr=document.createElement('tr');tr.className=ok?'good':'bad';for(const value of [d.name,ok?'발동':'미확인',Math.round(initial-lowest),healed.toFixed(2),maxBullets,g.viewWidth+' × '+g.viewHeight]){const td=document.createElement('td');td.textContent=value;tr.append(td);}rows.append(tr);status.textContent=d.name+' / '+(ok?'발동 확인':'발동 미확인')+' / '+[...seen].join(', ');return ok;
}
async function run(ids){if(busy)return;busy=true;try{for(let i=0;i<ids.length;i++){status.textContent=(i+1)+' / '+ids.length+' 검사 중';await scenario(ids[i]);}status.textContent+=' / 검사 종료';}catch(e){status.textContent='오류: '+e.stack;}finally{busy=false;}}
el('run').onclick=()=>run([el('tactic').value]);el('all').onclick=()=>{rows.replaceChildren();run(list.map(d=>d.id));};

ready().then(()=>status.textContent='준비 완료 / 실제 게임의 제어·사격·충돌·FX 경로로 검사합니다.').catch(e=>status.textContent=e.message);
