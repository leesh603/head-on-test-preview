<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEAD-ON 파일럿 전투·FX 실제 전후 비교</title>
<style>body{margin:0;background:#171c1b;color:#ece5d3;font:14px system-ui}header{padding:14px 20px}h1{font-size:19px;margin:0 0 8px}button,select{font:inherit;padding:8px;background:#303b36;color:inherit;border:1px solid #68705f;border-radius:5px}main{display:flex;gap:16px;justify-content:center}section{width:390px}h2{font-size:14px}iframe{width:390px;height:700px;border:1px solid #666}#status{margin:8px 0;min-height:20px}small{color:#bbb}label{margin-right:10px}</style>
<header><h1>파일럿 전투·FX · 실제 게임 엔진 전후 비교</h1><label>장면 <select id="scene"><option value="proctor-fire">프록터 · 관통 점사</option><option value="proctor-gap">프록터 · 재조준 간격</option><option value="schleich-front">슐라이히 · 정면 탄막 돌파</option><option value="schleich-rear">슐라이히 · 후방·중화기 한계</option><option value="lufbery-first">러프베리 · 좌측 표적</option><option value="lufbery-next">러프베리 · 우측 표적 인계</option><option value="lufbery-passive">러프베리 · 선회 기류</option><option value="schleich-passive">슐라이히 · 실제 피격</option></select></label><label>전장 <select id="region"><option value="0">전원</option><option value="1">바다</option><option value="15">야간</option></select></label><button id="prepare" disabled>동일 조건 재현</button> <button id="step">0.06초 진행</button><div id="status">두 게임 로딩 중…</div><small>실제 엔진·원화·HUD. 표적 배치·발동 조건을 고정한 Test Lab 촬영이며 자연 플레이와 구분합니다.</small></header>
<main><section><h2>BEFORE · main 3266b6c</h2><iframe id="before" title="변경 전 실제 게임"></iframe></section><section><h2>AFTER · 파일럿 전투·FX 개선</h2><iframe id="after" title="변경 후 실제 게임"></iframe></section></main>
<script>
const $=id=>document.getElementById(id),frames=[$('before'),$('after')];let apis=[],games=[];
frames[0].src='./qa-combat-before.html?headonTest=1&autostart=0';frames[1].src='./qa-combat-after.html?headonTest=1&autostart=0';
function status(){ $('status').textContent='재현 완료 · '+games.map((g,i)=>(i?'후':'전')+' HP '+g.hp.toFixed(1)+' · 발사 '+(g.roundsFired||0)+' · 도탄 '+(g.pilotIdentity?.three?.deflections||0)+' · 적중 '+(g.qaTargets||[]).map(t=>Math.round(10000-t.e.hp)).join(',')).join(' / ');}
function target(g,x,y){g.spawnEnemy('bomber');const e=g.enemies.at(-1);Object.assign(e,{x:g.x+x,y:g.y+y,a:-Math.PI/2,fire:Infinity,hp:10000,maxHp:10000,speed:0});(g.qaTargets??=[]).push({e,x,y});return e;}
function step(g,fire=false,dt=.02){for(const v of g.qaTargets||[]){v.e.x=g.x+v.x;v.e.y=g.y+v.y;v.e.a=-Math.PI/2;}g.state='playing';g.update(dt,{inputMode:'gamepad',fireHeld:fire,angle:g.qaAngle??-Math.PI/2});g.state='paused';}
async function advance(time,fire=false){for(let t=0;t<time-.001;t+=.02){games.forEach(g=>step(g,fire));if(Math.round(t*50)%3===0)await new Promise(requestAnimationFrame);}}
function hit(g,e){g.bullets.push({x:e.x,y:e.y,vx:0,vy:0,life:.1,enemy:false,ownerId:g.id||'p1',gun:0,identityGun:true,damage:1,hit:new Set()});step(g);}
$('prepare').onclick=async()=>{ $('prepare').disabled=true;$('status').textContent='실제 상태 재현 중…';try{
 const [pilot,phase]=$('scene').value.split('-');games=apis.map((api,i)=>{const win=frames[i].contentWindow,old=win.Math.random;win.Math.random=()=>.5;api.start({pilot,region:Number($('region').value),invincible:false,freeze:true});win.Math.random=old;const g=api.debug();g.rng=()=>.5;
 for(const k of ['spawn','eventTimer','nextBossAt','nextHeavyAt','flakTimer','regionThreat','fieldUnitTimer','gasTimer','gustTimer','patrolTimer','supplyTimer','allyTimer'])g[k]=Infinity;
 g.enemies.length=0;g.bullets.length=0;g.drops.length=0;g.allies.length=0;g.x=g.y=0;g.a=-Math.PI/2;g.need=Infinity;
 if(pilot==='proctor'){target(g,0,-170);target(g,0,-310);}if(pilot==='lufbery'){target(g,-150,-250);target(g,155,-270);}return g;});
 while(frames.some(f=>!f.contentDocument.getElementById('regionTransition').classList.contains('hidden')))await new Promise(requestAnimationFrame);
 await advance(.4);
 if(phase!=='passive'){games.forEach(g=>{g.state='playing';g.skill();g.state='paused';g.fire=0;});}
 if(pilot==='proctor')await advance(phase==='gap'?.44:.24,true);
 if(pilot==='lufbery'){
  if(phase==='passive'){games.forEach(g=>g.qaAngle=-Math.PI/2+.6);await advance(.18,false);}
  else await advance(phase==='next'?.68:.2,true);
 }
 if(pilot==='schleich'){
  if(phase==='passive'){games.forEach(g=>{g.invuln=0;g.state='playing';g.damageSource={x:g.x+40,y:g.y-10};g.hit(12);g.damageSource=null;g.state='paused'});await advance(.06);}
  else{
   await advance(.72);
   games.forEach(g=>{g.invuln=0;for(let i=-3;i<=3;i++)g.bullets.push({x:g.x+i*18,y:g.y-96,vx:0,vy:350,life:2,enemy:true,damage:12});
    if(phase==='rear'){g.bullets.push({x:g.x,y:g.y+50,vx:0,vy:-400,life:2,enemy:true,damage:20});g.bullets.push({x:g.x+24,y:g.y-70,vx:0,vy:350,life:2,enemy:true,heavy:true,damage:20});}
   });await advance(phase==='rear'?.18:.08,false);
  }
 }
 games.forEach(g=>g.events.length=0);status();
 }catch(e){$('status').textContent='오류: '+e.message;console.error(e)}finally{$('prepare').disabled=false}};
$('step').onclick=async()=>{await advance(.06);status()};
Promise.all(frames.map(f=>new Promise(resolve=>{const timer=setInterval(()=>{const api=f.contentWindow?.__HEADON_TEST__;if(api){clearInterval(timer);resolve(api)}},200)}))).then(a=>{apis=a;$('prepare').disabled=false;$('status').textContent='준비 완료 · 장면 선택 후 재현';});
</script></html>
