<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10171d">
<title>HEAD-ON Test Lab</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d1216;color:#e8e2d4}
*{box-sizing:border-box}body{margin:0;background:#0d1216}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
header{padding:12px 14px;border-bottom:1px solid #394047;background:#141b20;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header strong{letter-spacing:.08em}#build{font:12px ui-monospace,monospace;color:#c8ad76}.controls{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
label{display:grid;gap:3px;font-size:11px;color:#b9b4a9}select,button,a.action{min-height:34px;border:1px solid #4d5660;background:#202931;color:#f3ead9;border-radius:4px;padding:6px 9px;font:inherit}
button{cursor:pointer}.check{display:flex;align-items:center;gap:5px;min-height:34px;padding:0 4px;color:#ddd6c8}.check input{accent-color:#c8ad76}
button.primary{border-color:#b6955d;background:#56472f;font-weight:700}a.action{text-decoration:none;display:inline-flex;align-items:center}
main{min-height:0;display:flex;justify-content:center;align-items:flex-start;overflow:auto;background:#080b0d;padding:10px}
iframe{display:block;border:1px solid #303840;background:#000;width:100%;height:calc(100vh - 112px);max-width:100%}
#status{font:12px ui-monospace,monospace;color:#98b7a4;min-width:150px;padding-bottom:8px}
@media(max-width:720px){header{padding:9px}.controls{gap:6px}select,button,a.action{min-height:32px;padding:5px 7px}main{padding:0}iframe{border:0;height:calc(100vh - 165px)}}
</style>
</head>
<body>
<div class="shell">
<header>
<div><strong>HEAD-ON TEST LAB</strong><div id="build">preview build 확인 중…</div></div>
<div class="controls">
<label>맵<select id="region">
<option value="0">전원 지대</option><option value="1">아드리아해</option><option value="2">참호 전선</option>
<option value="3">포화의 참호전선</option><option value="4">도심</option><option value="5">고공 전역</option><option value="6">알프스 산맥</option><option value="7">제브뤼헤 군항</option><option value="8">캉브레 들판</option><option value="9">아라스 상공</option><option value="10">솜 강전선</option><option value="11">런던 대공습</option>
</select></label>
<label>파일럿<select id="pilot"><option>게임 로딩 중…</option></select></label>
<label>에이스<select id="ace"><option value="">등장 안 함</option></select></label>
<label class="check"><input id="boss" type="checkbox">보스 즉시</label>
<label class="check"><input id="invincible" type="checkbox" checked>무적</label>
<label>화면<select id="viewport"><option value="auto">자동</option><option value="390x844">모바일 390×844</option><option value="1280x800">PC 1280×800</option></select></label>
<button id="start" class="primary" type="button">선택 조건으로 시작</button>
<button id="partHit" type="button" disabled>보스 부위 실탄 테스트</button>
<label>타격<select id="hitTarget"><option value="0">첫 부위</option><option value="1">둘째 부위</option><option value="2">셋째 부위</option></select></label>
<label class="check"><input id="lethal" type="checkbox" checked>부위 파괴</label>
<label class="check"><input id="freeze" type="checkbox">관찰 일시정지</label>
<label class="check"><input id="noFire" type="checkbox">자동사격 중지</label>
<label class="check"><input id="hideHud" type="checkbox">관찰 HUD 숨김</label>
<button id="patternStep" type="button" disabled>보스 패턴 2초 진행</button>
<button id="reload" type="button">현재 브랜치 새로고침</button>
<a id="open" class="action" target="_blank" rel="noopener">게임만 열기 ↗</a>
<span id="status">게임 로딩 중…</span>
<output id="bossState" style="font-size:11px;max-width:700px"></output>
</div>
</header>
<main><iframe id="game" title="HEAD-ON Test Lab game" src="./index.html?headonTest=1&autostart=0&v=373"></iframe></main>
</div>
<script>
const $=id=>document.getElementById(id),frame=$('game');let api=null;
function query(){
 const p=new URLSearchParams({headonTest:'1',region:$('region').value,pilot:$('pilot').value,invincible:$('invincible').checked?'1':'0'});
 if($('boss').checked)p.set('boss','1');if($('ace').value)p.set('ace',$('ace').value);return p;
}
function refreshOpen(){ $('open').href='./index.html?'+query().toString(); }
function refreshAce(){
 const selected=api?.catalog?.pilots?.find(p=>p.id===$('pilot').value),old=$('ace').value;
 $('ace').replaceChildren(new Option('등장 안 함',''),new Option('랜덤 적 에이스','random'));
 for(const p of api?.catalog?.pilots||[])if(!selected||p.faction!==selected.faction)$('ace').append(new Option(p.name,p.id));
 if([...$('ace').options].some(o=>o.value===old))$('ace').value=old;refreshOpen();
}
function applyViewport(){
 const value=$('viewport').value;
 if(value==='auto'){frame.style.width='100%';frame.style.height='calc(100vh - 112px)';return}
 const [w,h]=value.split('x');frame.style.width=w+'px';frame.style.height=h+'px';
}
async function connect(){
 for(let i=0;i<100;i++){api=frame.contentWindow?.__HEADON_TEST__;if(api)break;await new Promise(r=>setTimeout(r,50))}
 if(!api){$('status').textContent='Test bridge 연결 실패';return}
 const old=$('pilot').value;$('pilot').replaceChildren();
 for(const p of api.catalog.pilots)$('pilot').append(new Option(p.name+' · '+(p.faction==='central'?'동맹국':'협상국'),p.id));
 $('pilot').value=[...$('pilot').options].some(o=>o.value===old)?old:'baron';refreshAce();$('status').textContent='준비 완료';
}
frame.addEventListener('load',connect);
$('start').onclick=()=>{
 if(!api)return;$('status').textContent='시작 중…';
 const result=api.start({region:Number($('region').value),pilot:$('pilot').value,ace:$('ace').value,boss:$('boss').checked,invincible:$('invincible').checked});
 $('partHit').disabled=!result;$('patternStep').disabled=!result;$('status').textContent=result?'실행 · '+result.plane+' · map '+result.region:'시작 실패';refreshOpen();
 if(result&&$('freeze').checked)api.debug().state='paused';
 if(result&&$('noFire').checked)api.debug().fire=Infinity;
 applyHud();
};
function applyHud(){const el=frame.contentDocument?.getElementById('flightTop151');if(el)el.style.visibility=$('hideHud').checked?'hidden':'';}
$('hideHud').onchange=applyHud;
$('noFire').onchange=()=>{const g=api?.debug?.();if(g)g.fire=$('noFire').checked?Infinity:0;};
$('freeze').onchange=()=>{const g=api?.debug?.();if(g)g.state=$('freeze').checked?'paused':'playing';};
setInterval(()=>{
 const g=api?.debug?.(),b=g?.stageBoss?.stages?.encounter?.bodies;const boss=b&&[...b.values()].find(b=>!b.dead);
 $('bossState').textContent=boss?boss.kind+' · '+boss.phase+' · t '+(boss.motionTime||0).toFixed(1)+' · '+[...boss.parts.values()].map(p=>p.id+': '+Math.ceil(p.hp)+'/'+Math.ceil(p.maxHp)+(p.destroyed?' 파괴':'')).join(' | ')+' · 장벽 '+(g.stageBoss?.hazards?.pool?.count||0):'';
},250);
$('partHit').onclick=()=>{
 const game=api?.debug?.();if(game?.state==='paused'){game.state='playing';frame.contentDocument?.getElementById('modal')?.classList.add('hidden')}
 const bodies=game?.stageBoss?.stages?.encounter?.bodies;
 const boss=bodies&&[...bodies.values()].find(body=>!body.dead&&body.parts?.size);
 const part=boss&&[...boss.parts.values()][Number($('hitTarget').value)];
 if(!boss||!part){$('status').textContent='타격 가능한 보스 부위 없음';return}
 game.bullets.push({x:boss.x+part.x,y:boss.y+part.y,vx:0,vy:0,life:.3,enemy:false,ownerId:game.id,damage:$('lethal').checked?part.hp+1:part.maxHp*.3,collisionRadius:2,hit:new Set()});
 game.update(.04,{});if($('freeze').checked)game.state='paused';
 $('status').textContent='실탄 투입 · '+part.id;
};
$('patternStep').onclick=()=>{
 const game=api?.debug?.();if(game?.state==='paused'){game.state='playing';frame.contentDocument?.getElementById('modal')?.classList.add('hidden')}
 if(!game||game.state!=='playing'){$('status').textContent='진행 가능한 전투 없음';return}
 const px=game.x,py=game.y,pa=game.a;
 for(let i=0;i<50&&game.state==='playing';i++)game.update(.04,{});
 game.x=px;game.y=py;game.a=pa;
 if($('freeze').checked)game.state='paused';
 $('status').textContent='패턴 진행 · 기뢰 '+(game.hostileMinefields?.flatMap(f=>f.mines).length||0)+' · 장벽 '+(game.stageBoss?.hazards?.pool?.count||0);
};
$('reload').onclick=()=>{api=null;$('status').textContent='새로고침 중…';frame.src='./index.html?headonTest=1&autostart=0&t='+Date.now()};
$('pilot').onchange=refreshAce;$('region').onchange=refreshOpen;$('ace').onchange=refreshOpen;$('boss').onchange=refreshOpen;$('invincible').onchange=refreshOpen;$('viewport').onchange=applyViewport;
applyViewport();refreshOpen();
$('build').textContent='live-v'+(new URL(frame.src,location.href).searchParams.get('v')||'?');
</script>
</body>
</html>
