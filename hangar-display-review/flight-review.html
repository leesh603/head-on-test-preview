<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEAD-ON aircraft gameplay QA</title><style>body{margin:0;background:#192019;color:#eaddbd;font:14px system-ui}header{padding:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}button,select{padding:8px;font:inherit}iframe{display:block;width:1100px;max-width:100%;height:800px;border:0;margin:auto}output{white-space:pre-wrap;width:100%}</style><header><b>기체 실제 엔진 QA · 테스트 전용</b><select id="choice" aria-label="파일럿과 기체"></select><button id="start">기체 시작</button><button id="step">직진 2초</button><button id="turn">선회 2초</button><button id="damage">실제 피격 처리</button><button id="resume">실시간 비행</button><button id="freeze">관찰 정지</button><select id="viewport" aria-label="화면 크기"><option value="1100">PC 1100</option><option value="390">모바일 390</option></select><output id="status">게임 로딩 중…</output></header><iframe src="./?headonTest=1&autostart=0" title="실제 HEAD-ON 게임"></iframe><script type="module">
const frame=document.querySelector('iframe'),select=document.querySelector('#choice'),status=document.querySelector('#status');
const {PILOT_AIRCRAFT,pilotAircraftChoices,SORTIE_FITS}=await import('./pilot-aircraft.js?v=pilotair1&art=pilot-recovery2');
for(const pilot of Object.keys(PILOT_AIRCRAFT))for(const plane of pilotAircraftChoices(pilot)){const o=document.createElement('option');o.value=pilot+'|'+plane;o.textContent=pilot+' / '+(SORTIE_FITS[plane]?.name||plane);select.append(o)}
let api;const connect=setInterval(()=>{try{api=frame.contentWindow.__HEADON_TEST__;if(api){clearInterval(connect);status.textContent='준비 완료 · 32 pilots / 56 choices'}}catch{}},250);
function show(action){const g=api?.debug();if(!g)return;status.textContent=JSON.stringify({action,pilot:g.pilot,plane:g.plane,state:g.state,time:+g.t.toFixed(2),hp:g.hp,maxHp:g.maxHp,angle:+g.a.toFixed(3)});frame.dataset.pilot=g.pilot;frame.dataset.plane=g.plane}
document.querySelector('#start').onclick=()=>{if(!api)return;const [pilot,plane]=select.value.split('|');api.start({pilot,plane,region:0,invincible:true,freeze:true});show('정상 비행 원화')};
document.querySelector('#step').onclick=()=>{api?.step(2,0);show('직진 · 실제 update 100회')};
document.querySelector('#turn').onclick=()=>{api?.step(2,.7);show('선회 · 실제 update 100회')};
document.querySelector('#damage').onclick=()=>{const g=api?.debug();if(!g)return;g.invuln=0;g.hit(g.maxHp*.6);g.invuln=Infinity;api.step(.3,0);show('실제 Game.hit 이후 손상')};
document.querySelector('#resume').onclick=()=>{api?.freeze(false);show('실시간 비행')};document.querySelector('#freeze').onclick=()=>{api?.freeze(true);show('관찰 정지')};document.querySelector('#viewport').onchange=()=>frame.style.width=document.querySelector('#viewport').value+'px';
</script></html>
